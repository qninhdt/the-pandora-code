slug: tulkun-not-quite-whales
status: published
title:
  vi: Tulkun — Khi "cá voi" có lịch sử, văn hóa và chính trị
  en: Tulkun Beyond Whales
subtitle:
  vi: >-
    Payakan không chỉ nhớ một cuộc săn. Cậu mang theo một tiểu sử, một bản án và một truyền thống mà
    cái chết của từng cá thể có thể xóa khỏi đại dương.
  en: >-
    Payakan does not merely remember a hunt. He carries a biography, a judgment, and a tradition
    that the death of one individual can erase from an ocean.
hook:
  vi: >-
    Tulkun trông giống cá voi đủ để ta nhận ra chúng, rồi khác cá voi đủ để khiến phép so sánh ấy
    trở nên nguy hiểm. Lần theo câu chuyện Payakan sẽ dẫn ta tới một dạng di truyền không nằm trong
    ADN: văn hóa được học, truyền lại và có thể tuyệt chủng trước cả một loài.
  en: >-
    Tulkun look enough like whales to be legible, then differ enough to make the comparison
    dangerous. Following Payakan leads to an inheritance outside DNA: culture that is learned,
    transmitted, and capable of going extinct before a species does.
