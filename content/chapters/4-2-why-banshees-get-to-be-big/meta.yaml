title:
  vi: Bí quyết giúp banshee sở hữu thân hình khổng lồ
  en: Why banshees get to be big
subtitle:
  vi: >-
    Một con toruk dang cánh rộng hơn cả một chiếc tiêm kích, lao khỏi vách núi bay và lượn vòng trên
    rừng. Trên Trái Đất, không một loài biết bay nào được phép to đến thế — có một bức tường vật lý
    chặn lại ở quãng vài trăm ký. Câu hỏi không phải "vì sao chúng đẹp" mà là "vì sao bầu trời
    Pandora lại cho phép những thân hình mà bầu trời chúng ta cấm tiệt?"
  en: >-
    A toruk spreads wings wider than a fighter jet, drops off a floating crag, and banks out over
    the forest. On Earth, nothing that flies is allowed to get that large — a wall of physics stops
    fliers at a few hundred kilograms. The question is not why they are beautiful, but why Pandora's
    sky permits the bodies that ours forbids.
hook:
  vi: >-
    Banshee và toruk lớn đến mức trông như phạm luật. Và đúng là có luật thật: lực nâng, tải trọng
    cánh, và một đường giao nhau nghiệt ngã giữa sức cơ bắp có thể tạo ra và sức mà việc bay đòi hỏi
    — đường giao ấy đặt trần kích thước cho mọi loài vỗ cánh, và trên Trái Đất nó nằm ở quãng
    Quetzalcoatlus, con thú bay lớn nhất từng tồn tại. Pandora không xé bỏ phương trình. Nó chỉ vặn
    hai núm điều chỉnh — hấp dẫn thấp hơn, không khí đặc hơn — và cái trần ấy trượt lên cao. Câu
    chuyện về vì sao banshee được phép to là một bài học trung thực về chính giới hạn của bay.
  en: >-
    Banshees and the toruk are big enough to look illegal. And there really is a law: lift, wing
    loading, and a merciless crossing point between the power a muscle can supply and the power
    flight demands — a crossing that caps the size of every flapping animal, and on Earth sits
    around Quetzalcoatlus, the largest creature that ever flew. Pandora does not tear up the
    equation. It turns just two dials — lower gravity, denser air — and the ceiling slides upward.
    The story of why a banshee gets to be big is an honest lesson in the limits of flight itself.
