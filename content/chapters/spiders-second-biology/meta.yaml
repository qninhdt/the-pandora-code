slug: spiders-second-biology
status: published
title:
  vi: Spider và cơ thể thứ hai bên trong cơ thể
  en: Spider’s Second Biology
subtitle:
  vi: >-
    Một cậu bé loài người tháo mặt nạ dưỡng khí ra giữa bầu không khí độc của Pandora — và không
    chết. Không phải phép màu, mà là cộng sinh nội bào: câu chuyện về cách một sinh vật khác có thể
    dọn vào sống trong cơ thể bạn và viết lại nó, kể qua bốn rào cản sinh học có thật.
  en: >-
    A human boy pulls his breathing mask off in Pandora’s poison air — and does not die. Not magic,
    but endosymbiosis: the story of how another organism can move into your body and rewrite it,
    told through four real biological hurdles.
hook:
  vi: >-
    Cơ thể bạn đã từng bị một sinh vật khác chiếm đóng và viết lại — chuyện đó xảy ra hai tỉ năm
    trước, và bạn vẫn đang thở nhờ nó. Spider Socorro chỉ là câu chuyện ấy được tua nhanh từ thang
    thời gian tiến hóa xuống còn vài ngày: một loài nấm cộng sinh dọn vào một cơ thể người và dạy nó
    hít thở một hành tinh xa lạ. Câu hỏi không phải "có phép màu nào không" — mà là cần vượt qua
    đúng bốn rào cản sinh học nào, và Trái Đất đã chứng minh được bao nhiêu trong số đó.
  en: >-
    Your body was once colonized and rewritten by another organism — it happened two billion years
    ago, and you are still breathing because of it. Spider Socorro is only that same story fast-
    forwarded from evolutionary time down to a few days: a symbiotic fungus moves into a human body
    and teaches it to breathe an alien world. The question is not whether there is magic in it, but
    exactly which four biological hurdles it would have to clear — and how many of them Earth has
    already proven.
