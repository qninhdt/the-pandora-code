slug: squidray-and-the-deep-ocean-design-space
status: published
title:
  vi: Quỷ mực dưới miệng phun thủy nhiệt
  en: Squidray and the Deep-Ocean Design Space
subtitle:
  vi: >-
    Con tsyong mang hai bộ động cơ không thể cùng tồn tại trong một cơ thể — và cả hai đều chỉ hợp
    lý khi ta thôi coi vực sâu là chốn giam cầm mà nhìn nó như một tấm giấy phép.
  en: >-
    The tsyong carries two engines that should not fit in one body — and both of them only make
    sense once you stop reading the deep as a prison and start reading it as a permit.
hook:
  vi: >-
    Một con vật nặng nhiều tấn trồi lên từ nước đen, xé nắp tàu ngầm RDA rồi biến mất. Truy ngược cú
    trồi ấy sẽ dẫn tới một ý niệm chuyển được sang bất kỳ đại dương nào: nước biển không cấm đoán mà
    chỉ ra giá — và ở dưới sâu, cái giá của tốc độ lại rẻ hơn hẳn so với trên mặt.
  en: >-
    A multi-tonne animal comes up out of black water, shears open an RDA canopy, and is gone.
    Tracing that breach leads to an idea that transfers to any ocean: seawater does not forbid, it
    prices — and in the deep, speed is far cheaper than it is at the surface.
