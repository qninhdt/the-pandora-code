title:
  vi: Dòng thời gian sâu thẳm của Pandora
  en: Pandora’s Deep Time
subtitle:
  vi: Thời gian sâu thẳm của Pandora
  en: >-
    How to read the age of a world you have only just reached - and how we know Earth is 4.5 billion
    years old: geochronology, radiometric dating, and the biography of a planet
hook:
  vi: >-
    Trong lòng bàn tay một nhà địa chất là một hạt tinh thể nhỏ hơn hạt cát, bới ra từ lớp đá sa
    thạch cổ trên cao nguyên Pandora. Nó là một chiếc đồng hồ. Khắc bên trong cấu trúc nguyên tử của
    nó là con số năm tháng - không phải vài nghìn năm, mà hàng tỉ - cùng dấu vết của cú va chạm đã
    khai sinh ra thế giới này. Cả chương này là câu hỏi làm thế nào một viên đá lại biết kể tuổi của
    chính nó, và vì sao cùng một mẹo ấy lại đọc được tuổi của bất kỳ tảng đá nào trong cả thiên hà.
  en: >-
    In a geologist's palm sits a crystal grain smaller than a sand mote, picked from the ancient
    sandstone of a Pandoran highland. It is a clock. Written into its atomic structure is a number
    of years - not thousands but billions - and the scar of the collision that built this world. The
    whole of this chapter is the question of how a stone comes to know its own age, and why the same
    trick reads the age of any rock in the galaxy.
