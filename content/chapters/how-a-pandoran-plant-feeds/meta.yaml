slug: how-a-pandoran-plant-feeds
status: published
title:
  vi: Một cái cây Pandora ăn bằng cách nào?
  en: How Does a Pandoran Plant Feed?
subtitle:
  vi: >-
    Rừng Pandora màu tím, và nguyên tác không nói vì sao. Truy nguyên đường đi của một hạt photon qua một
    chiếc lá — từ hai ngôi sao xuống tới rễ — và màu tím hóa ra là một chiến lược, còn cuộc mặc cả ở
    lỗ khí hóa ra là thứ mà mọi chiếc lá trong vũ trụ đều phải trả giá.
  en: >-
    Pandora's forest is violet, and canon never says why. Trace one photon through one leaf — from
    two suns down to the roots — and the colour turns out to be a strategy, while the trade at the
    pore turns out to be the price every leaf anywhere has to pay.
hook:
  vi: >-
    Một chiếc lá tím trong tầng dưới tán rừng Pandora không phải là lựa chọn của họa sĩ thiết kế —
    hay đúng hơn, nó là thế, nhưng vẫn có một câu trả lời sinh học đúng cho câu hỏi vì sao nó có thể
    tím. Lá mang màu của thứ ánh sáng nó từ chối, và dưới hai ngôi sao khác Mặt Trời, thứ đáng từ
    chối cũng khác. Từ đó, ta lần theo carbon đi hết chiều dài một cái cây.
  en: >-
    A violet leaf in Pandora's understorey is not a production designer's whim — or rather it is,
    but there is still a biologically correct answer to why it could be violet. A leaf is the colour
    of the light it refuses, and under two suns unlike ours, a different refusal pays. From there we
    follow the carbon the whole length of a tree.
