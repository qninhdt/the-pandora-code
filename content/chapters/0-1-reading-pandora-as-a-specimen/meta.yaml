title:
  vi: Mổ xẻ Pandora như một mẫu vật
  en: Reading Pandora as a specimen
subtitle:
  vi: Đọc Pandora như một mẫu vật
  en: Why this whole book treats Pandora as a specimen to be examined - and the four-tier system that keeps the reading honest
hook:
  vi: Một nhà thực vật học từng cố vấn cho đoàn phim Avatar ngồi xem thành phẩm và lặng lẽ chấm điểm từng lỗi nhỏ. Tư thế ấy - trìu mến, chăm chú, không chịu ngoảnh mặt khỏi sai sót - chính là cách cả cuốn sách này đọc Pandora. Không phải tóm tắt cốt phim, mà nhặt nó lên, soi ra ánh sáng, và hỏi câu mà mọi nhà tự nhiên học hỏi trước một mẫu vật lạ.
  en: A botanist who had advised the Avatar production sat watching the finished film and quietly grading its small errors. That posture - affectionate, attentive, unwilling to look away from a mistake - is how this entire book reads Pandora. Not a plot recap, but picking the world up, holding it to the light, and asking the question a naturalist asks of any unfamiliar specimen.
