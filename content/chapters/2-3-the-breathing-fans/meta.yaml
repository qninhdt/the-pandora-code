slug: the-breathing-fans
part: the-living-world
order: 3
status: published
title:
  vi: Những chiếc quạt thở
  en: The Breathing Fans
subtitle:
  vi: >-
    Vì sao loài thú Pandora thở bằng sườn chứ không bằng mũi - và điều cơ thể học so sánh dạy ta về
    một bài toán mà sự sống ở đâu cũng phải giải
  en: >-
    Why Pandoran animals breathe through their flanks, not their faces - and what comparative
    anatomy teaches about a problem every living thing must solve
hook:
  vi: >-
    Một con banshee lao thẳng đứng lên trời, cơ ngực cháy rực vì gắng sức - vậy mà không khí không
    đi vào qua mũi nó. Nó đi vào qua những khe hở trên mạn sườn. Câu đố ấy không có lời giải trong
    phim, nhưng lại nằm sẵn trong một nhánh sinh học Trái Đất đã dành cả thế kỷ để học cách sự sống
    hít thở.
  en: >-
    A banshee powers straight up into the sky, its flight muscles burning - and the air does not go
    in through its nose. It goes in through slots along its flanks. The films never explain the
    puzzle, but a branch of Earth biology spent a century learning exactly how life breathes, and
    the answer is sitting there in plain sight.
