title:
  vi: Sáu chi và khuôn mẫu đối xứng hai bên
  en: Six limbs and the bilateral lattice
subtitle:
  vi: 'Tại sao gần như mọi loài vật trên Pandora đều khoác lên mình cùng một bản thiết kế: sáu chi, bốn mắt, queue theo cặp - và tại sao chỉ duy nhất người Na''vi dám phá vỡ quy luật đó: sơ đồ cơ thể, Hox gene, và bộ công cụ di truyền nhào nặn nên một thế giới.'
  en: 'Why almost every Pandoran animal wears the same six-limbed, four-eyed, paired-queue blueprint - and why the Na''vi alone break it: body plans, Hox genes, and the genetic toolkit that builds a world'
hook:
  vi: 'Xếp bộ xương của một con thanator, một con banshee và một con tulkun nằm cạnh nhau, bạn sẽ thấy một bản thiết kế cứ lặp đi lặp lại không ngừng - sáu chi, bốn mắt, một cặp queue đâm chồi từ hai bên thái dương. Và rồi người Na''vi cao ba mét bước tới, đập tan bản thiết kế ấy thành từng mảnh - bốn chi, hai mắt, một chiếc queue duy nhất. Trọn vẹn chương này là để giải đáp cho câu hỏi: vì sao một hành tinh lại đúc gần như toàn bộ sự sống của mình từ một chiếc khuôn duy nhất, và vì sao giống loài thông tuệ nhất lại là kẻ ngoại lệ lẻ loi - một bí ẩn mà trớ trêu thay, ngành sinh học tiến hóa của chính Trái Đất đã nắm sẵn trong tay lời giải.'
  en: Lay the skeletons of a thanator, a banshee, and a tulkun side by side and you see one blueprint repeating - six limbs, four eyes, a pair of queues sprouting at the temples. Then comes the ten-foot Na'vi, and the blueprint shatters - four limbs, two eyes, a single queue. The whole of this chapter is the question of why a planet would cast nearly all its life from one mould, and why its cleverest species is the lone exception - a mystery that Earth's own evolutionary biology, it turns out, already knows how to solve.
