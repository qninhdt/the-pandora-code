title:
  vi: Nhịp điệu thời gian trên Pandora
  en: Time on Pandora
subtitle:
  vi: Thời gian trên Pandora
  en: >-
    Why the biggest thing in Pandora's sky never moves - yet a day still passes: tidal locking,
    libration, and the dance of orbital mechanics
hook:
  vi: >-
    Người Na'vi có một câu nói làm thay cả chiếc đồng hồ: "về nhà trước lúc nhật thực". Đó không
    phải thơ ca, mà là một giờ trong ngày - buổi xế chiều khi mặt trời sắp khuất sau hành tinh khổng
    lồ và thế giới chìm vào bóng tối giữa ban ngày. Trên Trái Đất, nhật thực toàn phần là kỳ quan
    hiếm hoi cả đời mới gặp một lần; trên Pandora, nó là tiếng chuông báo giờ mỗi ngày. Lần theo chữ
    "vì sao" ấy là toàn bộ chương này.
  en: >-
    The Na'vi have a phrase that does the work of a clock: be home by eclipse. It is not poetry but
    a time of day - the late afternoon when the sun slides behind the giant planet and the world
    goes dark in the middle of daylight. On Earth a total eclipse is a once-in-a-lifetime wonder; on
    Pandora it is a daily errand-bell. Following that "why" is the whole of this chapter - and the
    answer is a single fact about how Pandora moves.
