slug: the-wood-wide-web
part: eywa
order: 2
status: published
title:
  vi: 'Wood-Wide Web: mạng thật, ẩn dụ hay cả hai?'
  en: The Wood-Wide Web Revisited
subtitle:
  vi: >-
    Grace Augustine bốc một nắm rễ Pandora lên và bảo rằng cả khu rừng được nối với nhau bằng nhiều
    mối liên kết hơn cả số synapse trong não người. Câu hỏi không phải "có thật không?" mà là "thứ
    gì đang nối chúng?" — và câu trả lời nằm ngay dưới chân ta, trong một mạng nấm cổ 400 triệu năm.
  en: >-
    Grace Augustine lifts a handful of Pandoran roots and says the whole forest is wired together by
    more links than there are synapses in a human brain. The question is not "is it real?" but "what
    is doing the wiring?" — and the answer lies under our own feet, in a fungal web 400 million
    years old.
hook:
  vi: >-
    Trên Pandora, rễ cây được cho là nối liền vạn vật — một mạng lưới điện hóa trải khắp một vệ
    tinh. Nhưng rễ cây thật không vươn xa quá tán lá của chính nó, nên một mạng phủ kín cả thế giới
    không thể chỉ là rễ chạm rễ. Phải có một tay trung gian thứ ba luồn lách giữa chúng. Trên Trái
    Đất, tay trung gian đó là nấm — và câu chuyện về cách nó nối những cái cây lại, về những gì nó
    thật sự làm được và những gì chỉ là truyền thuyết đẹp đẽ vượt mặt bằng chứng, là một trong những
    bài học trung thực nhất mà khoa học rừng có thể dạy ta.
  en: >-
    On Pandora the roots are said to connect everything — an electrochemical network strung across a
    whole moon. But real roots barely reach past their own canopy, so a world-spanning web cannot be
    root touching root. There has to be a third party threading between them. On Earth that third
    party is fungi — and the story of how it links trees, of what it provably does and what is only
    a beautiful tale that outran the evidence, is one of the most honest lessons forest science has
    to teach.
