status: published
title:
  vi: Tiến hóa hội tụ, nhưng không hẳn
  en: Convergent, but Not Quite
subtitle:
  vi: >-
    Tại sao một mặt trăng xa xôi cứ liên tục tái tạo lại những con vật của Trái Đất - và một quy
    luật duy nhất giúp bạn dự đoán hình thù của một sinh vật mà mình chưa từng chạm mặt.
  en: >-
    Why an alien moon keeps reinventing Earth's animals - and the one law that lets you predict the
    shape of a creature you have never seen
hook:
  vi: >-
    Người đầu tiên đặt chân vào cánh rừng Pandora đã liên tục điểm mặt gọi tên vạn vật - kia là một
    con báo, kia là một bầy sói, kia là một con đại bàng - và gần như gã luôn đoán trúng phóc vai
    trò của chúng, dẫu chưa một lần gọi đúng hình hài. Một mặt trăng mang trong mình nguồn gốc sự
    sống hoàn toàn độc lập, được kiến tạo dựa trên bản thiết kế cơ thể sáu chi, thế nhưng lại cứ
    ngang bướng tái diễn lại nguyên dàn diễn viên của Trái Đất. Lời giải đáp không phải là Pandora
    đang bắt chước chúng ta. Nó nằm ở một quy luật buộc sự sống, dù ở bất kỳ xó xỉnh nào, cũng phải
    hội tụ về đúng một danh sách ngắn ngủi những lời giải xuất sắc - và một sự thật sâu xa hơn đằng
    sau việc vì sao nó không bao giờ hội tụ một cách trọn vẹn.
  en: >-
    The first human to walk Pandora's forest kept naming things - that is a panther, that is a
    wolf-pack, that is an eagle - and was almost always right about the job, never about the build.
    A moon with its own separate origin of life, built on a six-limbed body plan, keeps stubbornly
    reinventing Earth's cast of characters. The answer is not that Pandora copied us. It is a law
    that forces life anywhere to converge on the same short list of good answers - and the deeper
    truth in why it never converges all the way.
