slug: physiology-of-pandoran-life
status: published
title:
  vi: Sinh lý học Sự sống Pandora
  en: Physiology of Pandoran Life
subtitle:
  vi: >-
    Vì sao cùng một bầu không khí lại giết người này và nuôi kẻ khác - và điều mà một phép tính hai
    dòng nói về mọi cơ thể từng thích nghi với bất cứ đâu
  en: >-
    Why the same air kills one body and feeds another - and what a two-line calculation says about
    every organism that ever adapted to anywhere
hook:
  vi: >-
    Một recombinant đứng giữa trảng rừng mà không cần mặt nạ, ngay cạnh một con người sẽ chết trong
    bốn phút nếu tháo mặt nạ ra. Cùng một bầu khí quyển, cùng một thể tích khí mỗi hơi thở. Khác
    biệt không nằm ở phổi - nó nằm trong độ pH của máu, và ta có thể tính ra con số ấy.
  en: >-
    A recombinant stands unmasked in a forest clearing beside a human who would be dead in four
    minutes without the mask. Same atmosphere, same lungful of it per breath. The difference is not
    in the lungs - it is in the pH of the blood, and that number can be worked out.
