title:
  vi: Hometree – Nền móng của cả hệ sinh thái
  en: Hometree as keystone
subtitle:
  vi: >-
    Một sinh vật cao hơn ba trăm mét, sống suốt hai mươi nghìn năm, đổ xuống trong vài phút. Cùng
    lúc ấy, mạng lưới Eywa không hề chớp một nhịp. Vậy cái cây ấy quan trọng, hay không quan trọng?
    Câu trả lời buộc ta phải sửa lại từ ngữ mà sinh thái học đại chúng dùng sai nhiều nhất.
  en: >-
    An organism more than three hundred metres tall, twenty thousand years old, comes down in
    minutes. At the same moment, Eywa's network does not flicker. So did the tree matter, or not?
    Answering that honestly forces us to repair the most abused word in popular ecology.
hook:
  vi: >-
    Ai cũng gọi Hometree là "loài chủ chốt", và cách gọi ấy sai — sai theo một kiểu hữu ích. Loài
    chủ chốt của Robert Paine là kẻ hiếm hoi, tác động qua việc ăn; Hometree thì chiếm phần lớn
    sinh khối quanh nó và tác động chỉ bằng cách tồn tại. Đó là hai cơ chế khác nhau, và phân biệt
    được chúng là chìa khóa giải thích vì sao đốn Hometree vừa chẳng làm mạng lưới hành tinh nhíu
    mày, vừa là một tổn thất không gì bù nổi. Bài học mang về: sinh khối mọc lại trong vài thập
    niên, nhưng cấu trúc cần hàng thế kỷ — có những thứ chỉ thời gian mới dựng được.
  en: >-
    Everyone calls Hometree a keystone, and everyone is wrong in a useful way. Robert Paine's
    keystone was rare and worked by eating; Hometree is most of the biomass around it and works
    merely by standing there. Those are different mechanisms, and telling them apart is what
    explains how felling Hometree can leave a planetary network untroubled and still be a loss
    nothing can repay. The idea to carry away: biomass grows back in decades, structure takes
    centuries — some things only time can build.
