subtitle:
  vi: Lục địa, đại dương, khí hậu
  en: Why almost an entire moon is rainforest - and how the same law that places Earth's forests and deserts predicts Pandora's map before you ever see it
hook:
  vi: Đứng trên một sống núi của Australis, rừng mưa trải dài tới tận chân trời rồi đổ xuống Biển Đông, và bạn có thể tự hỏi vì sao Pandora hào phóng rừng nhiệt đới đến thế trong khi Trái Đất chỉ ban phát nó thành một dải hẹp quanh xích đạo. Câu trả lời không nằm ở Pandora. Nó nằm ở một cỗ máy không khí mà mọi hành tinh có khí quyển đều vận hành - và một khi hiểu nó, bạn sẽ đọc được tấm bản đồ của bất kỳ thế giới nào chỉ từ vài con số.
  en: Stand on a ridge in Australis, where rainforest runs unbroken to the horizon and then spills into the Eastern Sea, and you might wonder why Pandora is so lavish with tropics when Earth rations them to a thin band at the equator. The answer is not on Pandora. It is in a machine made of air that every atmosphere runs - and once you understand it, you can read the map of any world from a handful of numbers.
