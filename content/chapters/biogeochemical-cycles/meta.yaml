slug: biogeochemical-cycles
status: published
title:
  vi: Sổ sách của một hành tinh
  en: A Planet's Bookkeeping
subtitle:
  vi: >-
    Người Na'vi nói mọi năng lượng chỉ là vay mượn. Đó là thần học, và cũng là một phát biểu chính
    xác về bảo toàn khối lượng — nên nó có thể được kiểm toán. Chương này mở sổ sách của Pandora,
    tính bằng chính những con số canon đưa ra, và xem chúng có khớp.
  en: >-
    The Na'vi say all energy is only borrowed. That is theology, and it is also an exact statement
    of mass balance — which means it can be audited. This chapter opens Pandora's books, using
    canon's own figures, and checks whether they close.
hook:
  vi: >-
    Một thân thể được đặt vào chùm rễ, và trong vài tuần nó sẽ không còn ở đó nữa. Không có phép màu
    nào trong chuyện ấy: mọi nguyên tử của người đó đi vào một cuốn sổ mà hành tinh vẫn giữ, và cuốn
    sổ ấy luôn phải khớp. Chỉ cần một phép chia — lượng chứa trong bể chia cho tốc độ thoát ra — là
    ta có một dụng cụ đủ sức đo bất cứ thế giới nào. Đem nó áp lên bốn chu trình của Pandora, và ba
    trong số đó trả về những con số khiến ta phải dừng lại.
  en: >-
    A body is laid in a cluster of roots, and within weeks it is no longer there. Nothing miraculous
    happens: every atom of that person enters a ledger the planet keeps, and the ledger must always
    balance. One division — what a reservoir holds, over the rate it leaves — gives an instrument
    powerful enough to measure any world. Turn it on Pandora's four cycles and three of them return
    numbers that stop you where you stand.
