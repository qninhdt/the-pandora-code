title:
  vi: Khu rừng mang dáng dấp một thánh đường
  en: The forest as a cathedral
subtitle:
  vi: >-
    Đứng dưới chân một Hometree cao hơn ba trăm mét, ánh sáng rọi xuống thành từng cột qua mái vòm
    lá, ta nhận ra khu rừng không phải một môi trường sống duy nhất — mà là cả một chồng môi trường
    xếp lên nhau theo chiều cao. Câu hỏi không phải "rừng đẹp đến mức nào?" mà là "một cái cây làm
    sao vươn nổi tới đó, và bao nhiêu tầng sự sống chen chúc giữa gốc và ngọn?"
  en: >-
    Stand at the foot of a Hometree more than three hundred metres tall, watch the light fall in
    shafts through the vaulted roof of leaves, and the forest stops being one habitat. It becomes a
    stack of habitats piled on top of each other by height. The question is not how beautiful the
    forest is, but how a tree climbs that high at all — and how many floors of life crowd between
    the base and the crown.
hook:
  vi: >-
    Người Na'vi bước vào rừng như bước vào thánh đường, và phép so sánh ấy chính xác hơn ta tưởng:
    thánh đường được chia tầng — gian giữa, các dãy lầu, mái vòm — mỗi tầng một thứ ánh sáng, một
    bầu khí hậu, một lớp cư dân. Rừng Pandora cũng vậy. Nhưng ngọn Hometree cao hơn ba trăm mét lại
    va thẳng vào một bức tường mà mọi cái cây trên Trái Đất đều phải dừng lại trước nó: giới hạn vật
    lý của việc kéo nước lên cao. Câu chuyện về cách khu rừng tự xếp tầng, và về lằn ranh mà ngọn
    cây không thể vượt qua, là một trong những bài học trung thực nhất mà sinh thái học rừng có thể
    trao cho ta.
  en: >-
    The Na'vi enter the forest the way one enters a cathedral, and the comparison is more exact than
    it sounds: a cathedral is built in tiers — nave, galleries, vaulted roof — each with its own
    light, its own climate, its own inhabitants. So is the Pandoran forest. But a Hometree more than
    three hundred metres tall runs straight into a wall that every tree on Earth stops short of: the
    physical limit on how high a living thing can pull water. The story of how a forest sorts itself
    into floors, and of the line a treetop cannot cross, is one of the most honest lessons forest
    ecology has to teach.
