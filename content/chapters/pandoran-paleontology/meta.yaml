slug: pandoran-paleontology
status: published
title:
  vi: Cổ sinh vật học Pandora
  en: Pandoran Paleontology
subtitle:
  vi: >-
    Một mặt trăng có cả một sinh giới khổng lồ được ghi chép tỉ mỉ, mà không một hóa thạch nào được
    công bố. Cái hố rỗng ấy không phải phán quyết về quá khứ Pandora - nó là phán quyết về một loại
    đất, và về việc chúng ta đã đào sai chỗ.
  en: >-
    A moon with an exhaustively catalogued bestiary and not one published fossil. That empty pit is
    not a verdict on Pandora's past - it is a verdict on a soil type, and on digging in the wrong
    place.
hook:
  vi: >-
    Hai mét sâu, và không có gì. Cái hố xuyên qua một mét rưỡi đất laterite đỏ trong một khu rừng
    chở nhiều sinh khối động vật lớn trên mỗi hectare hơn bất cứ nơi nào trên Trái Đất - vậy mà vách
    hố chỉ có rễ, sét và vài hạt thạch anh. Không xương, không vỏ, không răng. Rừng bên trên đã chạy
    suốt hàng triệu năm; mặt đất bên dưới chẳng giữ lại chút nào. Câu hỏi thật không phải "quá khứ
    Pandora có thể biết được không", mà là: liệu chỗ này có bao giờ giữ nổi bất cứ thứ gì, kể cả khi
    có?
  en: >-
    Two metres down, and nothing. The pit cuts through a metre and a half of red laterite in a
    forest carrying more large-animal biomass per hectare than anywhere on Earth - and its walls
    hold roots, clay and a scatter of quartz. No bone, no shell, no tooth. The forest above has been
    running for millions of years; the ground below has kept none of it. The real question is not
    whether Pandora's past is knowable, but whether this place would have kept anything even if it
    were there.
