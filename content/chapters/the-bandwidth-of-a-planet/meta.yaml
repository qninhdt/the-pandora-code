slug: the-bandwidth-of-a-planet
status: published
title:
  vi: Băng thông của cả một hành tinh
  en: The Bandwidth of a Planet
subtitle:
  vi: >-
    Grace nói mạng lưới Pandora có nhiều kết nối hơn cả số synapse trong não người. Nhưng kỹ sư hỏi
    câu khác: bao nhiêu thông tin thực sự chảy qua mối liên kết tsaheylu, và nhanh đến mức nào? Lý
    thuyết thông tin của Shannon đặt một trần cứng lên mọi đường truyền - kể cả một sợi cáp thần
    kinh.
  en: >-
    Grace says Pandora's network has more connections than there are synapses in a human brain. But
    the engineer asks a different question: how much information actually crosses the tsaheylu bond,
    and how fast? Shannon's information theory sets a hard ceiling on any channel - even a nerve
    cable.
hook:
  vi: >-
    Đỉnh cao của mọi mối liên kết trên Pandora là khoảnh khắc cả một ý thức người băng qua sợi cáp
    sinh học để sang một thân xác mới. Canon coi đó là phép màu. Nhưng nếu ta cân nó bằng bit - đơn
    vị đo thông tin của Claude Shannon - thì câu hỏi đổi hẳn: một tâm trí nặng bao nhiêu bit, và một
    sợi dây thần kinh tải được bao nhiêu bit mỗi giây? Câu trả lời vừa đập tan cách đọc dễ dãi nhất,
    vừa bất ngờ cứu lấy cảnh quay bất khả thi nhất của cả bộ phim.
  en: >-
    The summit of every bond on Pandora is the moment an entire human consciousness crosses a
    biological cable into a new body. Canon calls it a miracle. But weigh it in bits - Claude
    Shannon's unit for information - and the question changes entirely: how many bits is a mind, and
    how many bits a second can a nerve carry? The answer both demolishes the easy reading and,
    surprisingly, rescues the single most impossible scene in the films.
