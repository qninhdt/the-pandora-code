slug: pandoran-water-and-weather
status: published
title:
  vi: Nước và Thời tiết trên Pandora
  en: Pandora's Water and Weather
subtitle:
  vi: >-
    Một thác nước rơi khỏi tảng đá không có gì phía trên - và cỗ máy phải chạy suốt ngày đêm để ngọn
    thác ấy không cạn
  en: >-
    A waterfall pouring off a rock with nothing above it - and the machine that has to run day and
    night to keep it from running dry
hook:
  vi: >-
    Từ mặt dưới của một khối núi bay, nước rời khỏi đá thành một dải trắng rồi tan vào sương trước
    khi kịp chạm đất. Phía trên tảng đá ấy không có gì cả - không sông, không tuyết, không lưu vực.
    Vậy dòng nước đó đến từ đâu, và vì sao sau bao nhiêu triệu năm nó vẫn chưa cạn? Câu hỏi nghe như
    một chi tiết nhỏ trong phim, nhưng để trả lời được, ta phải dựng lại toàn bộ vòng tuần hoàn nước
    của cả một hành tinh.
  en: >-
    From the underside of a floating massif, water leaves the rock as a white ribbon and dissolves
    into mist before it ever reaches the ground. There is nothing above that rock - no river, no
    snowfield, no catchment. So where does the water come from, and why, after all this time, has it
    not run dry? It sounds like a small question about a film. Answering it means rebuilding the
    entire water cycle of a world.
