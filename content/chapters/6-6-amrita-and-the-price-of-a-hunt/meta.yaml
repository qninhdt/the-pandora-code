slug: amrita-and-the-price-of-a-hunt
part: sea-and-reefs
order: 6
status: published
title:
  vi: Amrita và cái giá máu của một cuộc săn
  en: Amrita, Bioprospecting and Industrial Extraction
subtitle:
  vi: >-
    Hai lít chất lỏng vàng óng, và bốn mươi tấn xác thả trôi. Cái tỉ lệ ấy không phải sự lãng phí —
    nó là đáp số của một bài toán, và bài toán đó là toán học Trái Đất thật.
  en: >-
    Two litres of golden fluid, and forty tonnes of carcass set adrift. That ratio is not waste — it
    is the answer to an equation, and the equation is real Earth mathematics.
hook:
  vi: >-
    Người ta dễ đọc cuộc săn tulkun như lòng tham thuần túy. Nhưng nếu chịu làm phép tính, ta gặp
    một kết quả khó chịu hơn nhiều: khi một loài sinh sản chậm hơn tốc độ sinh lời của đồng tiền, và
    khi giá vẫn cao lúc đàn đã gần cạn, thì săn đến con cuối cùng chính là lựa chọn tối ưu về mặt
    tài chính. Đó là một định lý, không phải một tính cách.
  en: >-
    It is easy to read the tulkun hunt as simple greed. But do the arithmetic and a far more
    uncomfortable result appears: when a species breeds slower than money earns, and the price stays
    high as the population empties, hunting to the last individual is the financially optimal
    choice. That is a theorem, not a personality.
