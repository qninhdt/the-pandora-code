slug: the-reef-as-substrate
part: sea-and-reefs
order: 3
status: published
title:
  vi: Rạn san hô — Một thành phố được xây bởi sinh vật
  en: The Reef as Substrate
subtitle:
  vi: >-
    Làng Awa'atlu không đứng trên đá. Nó đứng trên thân xác tích tụ của những sinh vật khác — một
    cái nền sống được nuôi lớn bằng ánh sáng, và chỉ tồn tại chừng nào việc dựng xây còn nhanh hơn
    biển cả bào mòn.
  en: >-
    The Metkayina village of Awa'atlu does not stand on rock. It stands on the accumulated bodies of
    other organisms — a living floor grown out of sunlight, alive only as long as its builders keep
    pace with the sea.
hook:
  vi: >-
    Cả một ngôi làng đang đứng trên mặt biển. Cái sàn ấy do sinh vật tạo ra, và để hiểu nó ta phải
    hỏi: bức tường được làm từ gì? Câu trả lời dẫn tới mối cộng sinh kỳ lạ nhất sinh giới — con vật
    nuôi tảo trong tế bào mình, biến ánh nắng thành đá.
  en: >-
    A whole village is standing on the sea. That floor was made by living things, and to read it we
    must ask what the wall is made of. The answer leads to biology's strangest partnership — an
    animal farming algae inside its own cells, turning sunlight into stone.
