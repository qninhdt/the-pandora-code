slug: the-reef-as-substrate
part: sea-and-reefs
order: 3
status: published
title:
  vi: Rạn san hô — Một thành phố được xây bởi sinh vật
  en: The Reef as Substrate
subtitle:
  vi: >-
    Làng Awa'atlu không đứng trên đá. Nó đứng trên một cơ thể sống — cái nền mà một loài vật nuôi tảo
    trong tế bào mình rồi xây nên, và có thể chết đói hoặc tan ra ngay dưới chân bộ tộc.
  en: >-
    Awa'atlu does not stand on rock. It stands on a living body — a foundation an animal grew by
    farming algae inside its own cells, and one that can starve or dissolve beneath the clan.
hook:
  vi: >-
    Người Metkayina không xây nhà trên nền đất mà trên chính rạn san hô đang sống. Lần theo cái nền
    ấy sẽ dẫn ta tới một ý niệm chuyển được sang bất kỳ thế giới nào: rạn san hô không phải một tảng
    đá mà là một bảng cân đối — nơi kẻ xây và kẻ phá tranh nhau từng gram, và khi cán cân lật, cái
    nền tự tan vào biển.
  en: >-
    The Metkayina build not on land but on a living reef. Following that foundation leads to an idea
    that transfers to any world: a reef is not a rock but a balance sheet — builders and breakers
    contesting every gram — and when the balance tips, the ground itself dissolves back into the sea.
