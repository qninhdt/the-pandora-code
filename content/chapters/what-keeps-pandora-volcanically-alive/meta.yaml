slug: what-keeps-pandora-volcanically-alive
status: published
title:
  vi: Cỗ máy núi lửa của Pandora
  en: What Keeps Pandora Volcanically Alive?
subtitle:
  vi: >-
    Vì sao một mặt trăng nhỏ và cổ xưa vẫn còn nóng chảy - và điều gì thực sự đã chôn vùi tộc
    Mangkwan dưới biển tro: nhiệt thủy triều, phân rã phóng xạ, và lý do từ trường không thể nấu
    chảy đá
  en: >-
    Why a small, ancient moon is still molten inside - and what really buried the Mangkwan under
    ash: tidal heating, radioactive decay, and why a magnetic field cannot melt rock
hook:
  vi: >-
    Một thế hệ trước, quê hương của tộc Mangkwan là rừng già. Rồi một ngọn núi lửa nuốt chửng nó, và
    giờ họ đứng trên một đồng bằng dung nham đen nơi Cây Mẹ từng vươn cao. Cả chương này là một câu
    hỏi mà một nhà vật lý sẽ đặt ra khi nhìn ngọn lửa ấy: một mặt trăng nhỏ bằng này, già bằng này,
    lẽ ra phải nguội lạnh và chết từ lâu - vậy thứ gì vẫn đang đun sôi lòng nó?
  en: >-
    A generation ago the Mangkwan homeland was old-growth forest. Then a volcano swallowed it, and
    now they stand on a plain of black lava where a Hometree once rose. The whole of this chapter is
    a question a physicist would ask of that fire: a moon this small, this old, should have gone
    cold and dead long ago - so what is still boiling its insides?
