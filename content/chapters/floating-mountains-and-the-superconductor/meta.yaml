slug: floating-mountains-and-the-superconductor
status: published
title:
  vi: Một thế giới bị từ trường bẻ cong
  en: Floating Mountains, Unobtanium and the Flux Devil
subtitle:
  vi: >-
    Vì sao Dãy núi Hallelujah treo được trên không - lời giải đầu tiên của nguyên tác là lực đẩy
    Meissner, và nó không giữ nổi; lời giải thứ hai, được đính chính trong lặng lẽ, là ghim từ
    thông, và nó giữ được
  en: >-
    Why the Hallelujah Mountains hang in the air - canon's first answer, Meissner repulsion, cannot
    hold them up; its quietly corrected second answer, flux pinning, can
hook:
  vi: >-
    Một ngọn núi khổng lồ dài 16 kilomet treo lơ lửng giữa không trung chẳng phải là phép màu gì
    sất. Nó là một màn thị phạm vật lý được phóng to lên tầm vóc hành tinh - và nguyên tác đã chọn
    sai cơ chế ngay từ lần đầu, rồi lặng lẽ tự đính chính. Đáp án không nằm ở chỗ từ trường đẩy vật
    ra xa, mà ở chỗ một chiếc đĩa được làm lạnh có thể tự khóa mình cứng ngắc vào khoảng không vô
    định.
  en: >-
    A sixteen-kilometre mountain hanging in mid-air is not magic. It is a physics demonstration
    scaled up to planetary size - and canon picked the wrong mechanism first, then quietly corrected
    itself. The answer is not that a field pushes the rock away; it is that a cold disc can lock
    itself rigidly into empty space.
