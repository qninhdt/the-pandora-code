title:
  vi: Khi màn đêm không thật sự tối
  en: The Night Ecology
subtitle:
  vi: >-
    Khi ánh sáng tắt trên Pandora, khu rừng không ngủ — nó đổi ca. Câu hỏi không phải "loài nào hoạt
    động về đêm?" mà là "ai đã bảo chúng biết bây giờ là mấy giờ?" — và câu trả lời là một chiếc
    đồng hồ nằm sẵn bên trong từng tế bào, được lên dây bởi vòng quay của chính mặt trăng này.
  en: >-
    When the light goes out on Pandora, the forest does not sleep — it changes shift. The question
    is not which animals are active at night, but who told them what time it is — and the answer is
    a clock built into every cell, wound by the turning of this particular moon.
hook:
  vi: >-
    Mỗi buổi chiều, bóng của Polyphemus trượt qua và cả thế giới chìm vào tối. Rồi mặt đất bừng
    sáng, lũ thú ban ngày lặng lẽ tìm chỗ đậu, và một danh sách sinh vật hoàn toàn khác bắt đầu
    chuyển động. Trông như một phản xạ trước việc đèn tắt. Nhưng sinh học thời gian có một câu hỏi
    sắc hơn thế: liệu có sinh vật nào trên Pandora đang thực sự *đọc giờ*, hay tất cả chỉ là cái
    giật mình trước bóng tối? Phân biệt được hai điều đó là một trong những mẹo hay nhất mà khoa học
    từng nghĩ ra — và nó dẫn tới một sự thật lạnh người: một hành tinh có thể trao cho cơ thể ta một
    ngày mà ta không có khả năng giữ nhịp.
  en: >-
    Every afternoon the shadow of Polyphemus slides across and the world goes dark. Then the ground
    lights up, the day animals settle quietly onto their roosts, and an entirely different roster
    begins to move. It looks like a reflex to the lights going out. But chronobiology has a sharper
    question: is anything on Pandora actually reading a clock, or is all of this just a flinch at
    the dark? Telling those two apart is one of the finest tricks science ever devised — and it
    leads to a chilling fact: a planet can hand a body a day it has no physical capacity to keep.
