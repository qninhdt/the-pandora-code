slug: the-biological-zeppelin
part: fire-ash-wind
order: 3
status: published
title:
  vi: Medusoid - khí cầu sống
  en: The Biological Zeppelin
subtitle:
  vi: >-
    Một sinh vật khổng lồ trôi qua đầu bạn mà không hề đập cánh. Nó không bay theo nghĩa mà cả Phần
    II đã dạy - nó nhẹ hơn chính lượng không khí nó chiếm chỗ.
  en: >-
    A colossal animal drifts overhead without a single wingbeat. It is not flying in any sense Part
    II taught us - it simply weighs less than the air it displaces.
hook:
  vi: >-
    Mọi kẻ bay trong cuốn sách này tới giờ đều đập vào không khí để thắng trọng lực. Medusoid không
    làm thế. Nó treo mình giữa trời bằng nguyên lý Archimedes, tự lên men hydro trong ruột để làm
    khí nâng, và tộc Tlalim biến nó thành một con tàu sống. Nhưng lực nổi không phải quà tặng - nó
    là một bản quyết toán khối lượng khắt khe, và mỗi dòng trong đó đều phải trả bằng thể tích, bằng
    thức ăn, hoặc bằng sức cơ của một đàn vật kéo.
  en: >-
    Every flier in this book so far has beaten the air to defeat gravity. The Medusoid does not. It
    hangs in the sky by Archimedes' principle, ferments its own hydrogen for lifting gas, and the
    Tlalim have turned it into a living ship. But buoyancy is not a gift - it is an unforgiving mass
    budget, and every line in it is paid for in volume, in food, or in the muscle of a towing team.
