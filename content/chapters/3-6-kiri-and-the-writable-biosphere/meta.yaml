slug: kiri-and-the-writable-biosphere
part: eywa
order: 6
status: published
title:
  vi: Kiri và một sinh quyển có thể “viết lại” cơ thể
  en: Kiri and the Writable Biosphere
subtitle:
  vi: >-
    Kiri triệu tập cá, xoa dịu ikran, và có lẽ đã được chính Eywa nhào nặn nên. Đằng sau những phép
    màu ấy là một khoa học có thật đến giật mình: điện sinh học phát triển — thứ điện áp lặng lẽ mà
    cơ thể dùng để nhớ và viết nên hình dạng của chính nó.
  en: >-
    Kiri summons fish, calms banshees, and may have been authored by Eywa itself. Behind the
    miracles is a startlingly real science: developmental bioelectricity — the quiet voltage a body
    uses to remember, and to write, its own shape.
hook:
  vi: >-
    Một cô gái chạm tay xuống nước và cả một đàn cá xoay theo. Cô ngủ trong rừng và rêu thở cùng nhịp
    với cô. Thật dễ gọi đó là phép thuật. Nhưng trên Trái Đất có một nhánh khoa học đang chứng minh
    điều lạ lùng hơn nhiều: hình dạng của một cơ thể không chỉ nằm trong ADN mà còn được lưu trong
    một mẫu hình điện áp — và mẫu hình ấy có thể bị viết lại. Kiri không phải ngoại lệ với sinh học;
    cô là hiện thân kịch tính của một biên giới nghiên cứu rất thật.
  en: >-
    A girl lowers her hand into the water and a whole school of fish wheels to follow. She sleeps in
    the forest and the moss breathes in time with her. It is easy to call this magic. But on Earth
    there is a branch of science proving something far stranger: a body's shape lives not only in
    its DNA but in a pattern of voltage — and that pattern can be rewritten. Kiri is not an
    exception to biology; she is the dramatization of a very real research frontier.
