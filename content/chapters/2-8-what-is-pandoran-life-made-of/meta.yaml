slug: what-is-pandoran-life-made-of
part: the-living-world
order: 8
status: published
title:
  vi: Sự sống Pandora được nhào nặn từ đâu?
  en: What Is Pandoran Life Made Of?
subtitle:
  vi: >-
    Người Na'vi và con người có thể lai ghép gen với nhau — nghĩa là tận sâu bên trong, sự sống hai
    thế giới được dựng từ cùng một thứ vật liệu: carbon, nước, một chuỗi xoắn kép. Sinh học vũ trụ
    hỏi: bao nhiêu phần của sự sống là tất yếu, và bao nhiêu chỉ là một tai nạn đã đông cứng lại?
  en: >-
    Na'vi and human can be spliced into one living body — which means that, at the deepest level,
    two worlds' life is built from the same stuff: carbon, water, a double helix. Astrobiology asks
    how much of life is forced by chemistry, and how much is just a frozen accident.
hook:
  vi: >-
    Cơ thể avatar trôi nổi trong bể dưỡng chất là một sinh vật bất khả thi: nửa người, nửa Na'vi,
    một bộ gen duy nhất khâu lại từ hai thế giới cách nhau bốn năm ánh sáng — và nó sống. Để mối nối
    đó thành công, sự sống Pandora và sự sống Trái Đất phải là cùng một thứ vật liệu ở tầng sâu
    nhất. Vậy sự sống được làm từ gì, và bao nhiêu phần trong số đó là bắt buộc?
  en: >-
    The avatar floating in its tank is an impossible animal: half human, half Na'vi, a single genome
    stitched from two worlds four light-years apart — and it lives. For that splice to work,
    Pandoran life and Earth life must be the same stuff at the deepest level. So what is life made
    of, and how much of it is forced?
