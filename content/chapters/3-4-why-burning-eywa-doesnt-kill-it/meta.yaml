slug: why-burning-eywa-doesnt-kill-it
part: eywa
order: 4
status: published
title:
  vi: Vì sao thiêu rụi Eywa lại chẳng thể kết liễu được nó
  en: Why burning Eywa doesn't kill it
subtitle:
  vi: >-
    RDA đốt rụi cả những cánh rừng, quật ngã cái cây lớn nhất hành tinh, săn giết cả những đàn sinh
    vật — vậy mà mạng lưới sống mang tên Eywa không hề lụi tắt. Không phải phép màu, mà là toán học
    chính xác đến lạnh người về cách một mạng lưới sống sót, và cái ngưỡng duy nhất mà nó sẽ vỡ vụn.
  en: >-
    The RDA burns whole forests, fells the largest tree on the moon, hunts entire pods — and the
    living network called Eywa never goes out. Not magic, but a coldly precise mathematics of how a
    network survives, and the single threshold at which it would shatter.
hook:
  vi: >-
    Đốt một lỗ thủng trong rừng và bạn đã giết rất nhiều cây. Nhưng liệu bạn có làm tổn hại mạng
    lưới mà chúng thuộc về hay không lại là một câu hỏi hoàn toàn khác — và câu trả lời gần như luôn
    là không. RDA học được điều đó theo cách đau đớn nhất: bạn có thể quật ngã cái cây lớn nhất vệ
    tinh mà trí tuệ hành tinh không hề chớp mắt. Lý do nằm trong lý thuyết thẩm thấu và sự bền bỉ
    của mạng lưới — một trong những điều hữu ích nhất mà toán học từng chứng minh về những thứ kết
    nối.
  en: >-
    Burn a hole in a forest and you have killed a great many trees. Whether you have damaged the
    network they belong to is a completely different question — and the answer is almost always no.
    The RDA learns it the hard way: you can fell the largest tree on the moon and the planetary mind
    does not so much as flicker. The reason lives in percolation theory and network resilience — one
    of the most useful things mathematics has ever proven about connected things, and the precise
    map of the four ways it would, finally, fail.
