order: 4
status: published
title:
  vi: Đọc những dòng sông vô hình trên bầu trời
  en: How the Wind Traders Navigate a Planet
subtitle:
  vi: >-
    Tộc Tlalim đi vòng quanh Pandora hai lần mỗi năm trên những khinh khí cầu sống, không động cơ,
    không thiết bị, không dự báo. Cách họ làm được điều đó là một môn khoa học thật sự — chỉ là nó
    được lưu trong bài hát thay vì trong phương trình.
  en: >-
    The Tlalim circle Pandora twice a year in living aerostats, with no engine, no instruments and
    no forecast. What they do to manage it is a real quantitative science — it is just stored in
    songs instead of equations.
hook:
  vi: >-
    Một con thuyền có buồm còn cãi được với gió. Một khinh khí cầu thì không: nó không thể tự di
    chuyển so với khối khí đang mang nó đi, nên nó không có bánh lái nào theo nghĩa ta vẫn hiểu. Vậy
    mà các hoa tiêu Tlalim vẫn đến đúng điểm hẹn, băng qua cả một hành tinh. Bí mật nằm ở chỗ bầu
    trời không phải một dòng chảy duy nhất — nó là nhiều dòng sông xếp lớp, chảy ngược nhau, và độ
    cao chính là bánh lái.
  en: >-
    A sailing ship can argue with the wind. A balloon cannot: it has no way to move relative to the
    air carrying it, and so no rudder in any sense we normally mean. Yet Tlalim navigators still
    make their rendezvous, a planet's width away. The secret is that the sky is not one current but
    a stack of them, flowing against each other — and height is the rudder.
