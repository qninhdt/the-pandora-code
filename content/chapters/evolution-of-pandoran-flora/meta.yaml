slug: evolution-of-pandoran-flora
status: published
title:
  vi: Tiến hóa Thực vật Pandora
  en: Evolution of Pandoran Flora
subtitle:
  vi: >-
    Một tủ tiêu bản đầy tên Latin và không một sơ đồ phả hệ nào. Muốn dựng nó lên, trước tiên phải
    trả lời câu hỏi khó hơn: khi hai cái cây trông giống nhau, ta thực sự biết được điều gì?
  en: >-
    A specimen cabinet full of Latin names and not one family tree. To draw it you must first answer
    the harder question: when two plants resemble each other, what have you actually learned?
hook:
  vi: >-
    Hệ thực vật Pandora được ghi chép chi tiết hơn bất cứ hệ thực vật hư cấu nào — hai chục cái tên
    Linnaeus, kích thước, sinh cảnh, tập tính. Nhưng một tên chi là một luận điểm về nguồn gốc, và
    chưa ai từng kiểm chứng nó. Bầy thú thì đã có cây phả hệ hẳn hoi; hệ thực vật chỉ có một tủ hồ
    sơ. Chương này dựng lại cái cây còn thiếu ấy, và phát hiện ra rằng gần như mọi nét giống nhau
    trong tủ đều đang kể về mặt đất, chứ không phải về dòng dõi. Trên Trái Đất, dáng cây được phát
    minh ít nhất sáu lần độc lập, cái bình bắt mồi mười hai lần, và cỏ biển đã ba bốn lần quay lại
    đại dương. Kết luận cuối cùng thậm chí còn khó chịu hơn: với một hệ thực vật nối nhau bằng rễ,
    hình vẽ trung thực không phải một cái cây, mà là một mạng lưới.
  en: >-
    Pandora's flora is documented more thoroughly than any invented flora has a right to be — two
    dozen Linnaean names, with sizes, habitats and behaviour. But a genus name is an argument about
    descent, and nobody has ever tested one. The bestiary has a real family tree; the flora has a
    filing cabinet. This chapter builds the missing tree, and finds that nearly every resemblance in
    the drawer is reporting on the ground rather than on ancestry. On Earth the tree habit was
    invented independently at least six times, the pitcher trap about twelve, and seagrasses went
    back to the ocean three or four times over. The final answer is more awkward still: for a flora
    wired together underground, the honest diagram is not a tree but a network.
