slug: pandoran-plate-tectonics
status: published
title:
  vi: Lớp vỏ đang dịch chuyển
  en: A Crust That Moves
subtitle:
  vi: >-
    Bốn manh mối trên bề mặt Pandora đều chỉ về kiến tạo mảng, nhưng nguyên tác chưa từng nói tới một
    mảng nào - và Io chứng minh rằng ta có thể dựng núi cao mười tám kilômét mà chẳng cần mảng nào
    cả
  en: >-
    Four clues on Pandora's surface all point to plate tectonics, yet canon never mentions a single
    plate - and Io proves you can raise eighteen-kilometre mountains without any
hook:
  vi: >-
    Một vách đá cao hơn một kilômét, mặt cắt phơi ra từng tầng đá nằm ngang. Có gì đã nâng chúng lên
    đó, và trên Trái Đất thì câu trả lời chỉ có một: lớp vỏ biết dịch chuyển. Pandora có núi, có
    biển sâu, có vành núi lửa, có quặng đậm đặc - đủ bốn thứ mà trên Trái Đất đều do cùng một cỗ máy
    sinh ra. Nhưng không một tài liệu chính thức nào nói Pandora có mảng kiến tạo, và chưa ai từng
    đặt một máy đo địa chấn xuống mặt đất ấy.
  en: >-
    A cliff a kilometre high, its face laid open in flat horizontal beds. Something lifted them, and
    on Earth there is only one answer: a crust that moves. Pandora has ranges, deep seas, a volcanic
    province and richly concentrated ore - all four of the things one machine produces on Earth. Yet
    no official source says Pandora has plates, and nobody has ever set a seismometer on its ground.
