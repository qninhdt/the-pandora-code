slug: fire-as-ecology-weapon-and-technology
part: fire-ash-wind
order: 2
status: published
title:
  vi: Lửa không chỉ phá hủy
  en: Fire as Ecology, Weapon and Technology
subtitle:
  vi: >-
    Với mọi thị tộc khác, lửa là thứ đã lấy đi thế giới. Với tộc Mangkwan, lửa là thứ duy nhất còn
    lại để làm việc cùng - trên một hành tinh mà không khí chống lại chính ngọn lửa ấy.
  en: >-
    For every other clan, fire is what took the world away. For the Mangkwan it is the one thing
    left to work with - on a moon whose air fights the flame at every step.
hook:
  vi: >-
    Một kỵ sĩ banshee mang theo hòn than sống trong chiếc lò đá bọt, bay giữa thứ không khí gần một
    phần năm là carbon dioxide - thứ khí mà trên Trái Đất người ta dùng để dập lửa. Hòn than vẫn
    cháy. Hiểu được vì sao nó cháy, và vì sao một cánh bay bốc lửa mất khả năng điều khiển sau ba
    giây chứ không phải ba mươi, là hiểu rằng lửa không phải một chất: nó là cuộc đua giữa nhiệt
    sinh ra và nhiệt bị lấy đi.
  en: >-
    A banshee rider carries a live coal in a pumice cup through air that is nearly a fifth carbon
    dioxide - the gas we put in fire extinguishers. The coal stays lit. Understanding why, and why a
    burning wing loses control in three seconds rather than thirty, is understanding that fire is
    not a substance at all: it is a race between heat released and heat carried away.
