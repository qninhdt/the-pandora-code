status: published
title:
  vi: Khi sự rực rỡ trong đêm là chuẩn mực
  en: When Glow Is the Norm
subtitle:
  vi: >-
    Trên Pandora, gần như vạn vật đều phát sáng khi màn đêm buông — cây cỏ, nấm, muông thú, và cả
    làn da người Na'vi: hóa học của ánh sáng lạnh, và lý do tại sao bóng tối, chứ không phải ánh
    sáng, mới là điều bất thường.
  en: >-
    On Pandora nearly everything glows after dark — plants, fungi, fauna, even Na'vi skin: the
    chemistry of cold light, and why darkness, not light, is the anomaly here.
hook:
  vi: >-
    Trên Trái Đất, một sinh vật tự phát sáng là chuyện lạ — vài con đom đóm, ít loài nấm, và cả một
    đại dương sâu thẳm mà ta hiếm khi thấy. Trên Pandora thì ngược lại: khi sao lặn, cả khu rừng
    bừng sáng. Câu hỏi không phải "vì sao chúng phát sáng?" mà là "vì sao mọi thứ đều phát sáng?" —
    và câu trả lời nằm trong một phản ứng hóa học gần như không tỏa nhiệt, một mẹo tiến hóa đã được
    phát minh lại hàng chục lần, và một quy luật sinh thái lật ngược.
  en: >-
    On Earth a creature that makes its own light is a curiosity — a few fireflies, a handful of
    fungi, and a deep ocean we rarely see. On Pandora it is the reverse: when the star sets, the
    whole forest comes alight. The question is not "why do they glow?" but "why does everything
    glow?" — and the answer is a chemical reaction that wastes almost no heat, an evolutionary trick
    reinvented dozens of times, and one ecological rule turned inside out.
