status: published
title:
  vi: Đại dương trên Pandora
  en: Pandora’s Ocean
subtitle:
  vi: >-
    Mặt biển quanh Awa'atlu trong đến mức tưởng như chẳng che giấu điều gì. Nhưng ánh sáng chỉ chạm
    được lớp da mỏng phía trên; dưỡng chất lại tích tụ trong bóng tối. Giữa hai miền ấy là một cỗ
    máy vô hình của mật độ, gió, chuyển động quay và địa hình đáy biển.
  en: >-
    The sea around Awa'atlu looks too clear to conceal anything. Yet sunlight reaches only its thin
    upper skin while nutrients gather in darkness. Between them works an invisible machine of
    density, wind, planetary rotation, and seafloor relief.
hook:
  vi: >-
    Một người lặn rời vùng nước rạn san hô chan hòa ánh sáng và chìm xuống màu xanh lạnh hơn. Không
    có bức tường nào hiện ra, nhưng người ấy vừa đi xuyên qua một biên giới vật lý. Lần theo biên
    giới ấy sẽ dẫn ta tới nghịch lý nuôi sống đại dương: nơi có ánh sáng thì thiếu thức ăn cho cây,
    còn nơi có dưỡng chất lại không có ánh sáng để dùng chúng.
  en: >-
    A diver leaves the bright reef water and drops into a colder blue. No wall appears, yet the body
    has crossed a physical frontier. Following that frontier reveals the paradox that feeds an
    ocean: where there is light, plant food runs short; where nutrients gather, there is no light
    with which to use them.
