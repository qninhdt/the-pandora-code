slug: from-stardust-to-pandora
status: published
title:
  vi: Từ Bụi sao đến Pandora
  en: From Stardust to Pandora
subtitle:
  vi: Chuỗi cung ứng dài mười ba tỷ năm đã làm ra một hòn đá Pandora - và điểm nó gãy
  en: The thirteen-billion-year supply chain that made a Pandoran stone - and the link where it breaks
hook:
  vi: >-
    Nhặt một hòn đá lên ở Pandora. Không hòn nào đặc biệt - chỉ một mảnh vỏ hành tinh nặng hơn vẻ
    ngoài của nó, với chút ánh kim loé lên ở mặt vừa nứt. Giờ hãy hỏi câu mà không ai trong các bộ
    phim từng hỏi: những nguyên tử này đến từ đâu? Mỗi hạt nhân trong tay bạn đều phải được chế tạo
    riêng, bởi một quá trình vật lý cụ thể, ở một loại nơi cụ thể - và gần như mọi mắt xích trong
    chuỗi ấy đều liên quan tới một cái chết.
  en: >-
    Pick up a stone on Pandora. Not a remarkable one - just a piece of crust heavier than it looks,
    with a faint metallic glint on the fresh face. Now ask the question nobody in the films ever
    asks: where did these atoms come from? Every nucleus in your hand had to be manufactured
    individually, by a specific physical process, in a specific kind of place - and almost every
    link in that chain involves something dying.
