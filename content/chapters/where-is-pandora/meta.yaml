slug: where-is-pandora
part: the-world
order: 1
status: published
title:
  vi: Pandora nằm ở đâu?
  en: Where is Pandora
subtitle:
  vi: >-
    Địa chỉ thật của Pandora trong hệ Alpha Centauri - và nghệ thuật săn tìm một thế giới ta chưa
    thể nhìn thấy
  en: >-
    Pandora's real address in the Alpha Centauri system - and the art of hunting a world we cannot
    yet see
hook:
  vi: >-
    Đứng trên Pandora trước giữa trưa, bạn sẽ thấy mặt trời tắt lịm sau một bức tường vân mây cao
    ngang một phần ba bầu trời. Bầu trời ấy nói cho bạn biết bạn không đứng trên một hành tinh - mà
    trên một mặt trăng. Câu hỏi đặt ra rất giản dị: chính xác thì nơi này nằm ở đâu, và liệu có thứ
    gì như thế đang thực sự tồn tại đủ gần để một ngày nào đó ta chĩa kính viễn vọng vào và biết
    được?
  en: >-
    Stand on Pandora before midday and watch the sun go out behind a banded wall that fills a third
    of the sky. That sky tells you you are not on a planet but on a moon. The question is the
    patient one: where exactly is this place - and could anything like it really be out there, close
    enough that we might one day point a telescope at it and know?
