slug: the-pandoran-umwelt
part: the-living-world
order: 9
status: published
title:
  vi: Umwelt — Lăng kính tri giác trên Pandora
  en: The Pandoran Umwelt
subtitle:
  vi: >-
    Cùng một khu rừng, nhưng người Na'vi, con ikran và viên phi công loài người sống trong ba thế
    giới khác nhau — bởi mỗi loài chỉ cảm nhận được phần hiện thực mà giác quan của nó cho phép.
  en: >-
    One forest, but a Na'vi, an ikran and a human pilot live in three different worlds — because
    each creature perceives only the slice of reality its senses can reach.
hook:
  vi: >-
    Đặt một người Na'vi và một viên phi công loài người vào cùng một khu rừng đêm trên Pandora, và
    họ sẽ không hề ở chung một thế giới. Mặt đất bừng sáng dưới mỗi bước chân của người Na'vi; bảng
    điều khiển của viên phi công thì mù lòa giữa từ trường hỗn loạn. Câu hỏi không phải "ai nhìn
    thấy đúng?" mà là "vì sao không một ai trong họ nhìn thấy toàn bộ?" — và câu trả lời là một khái
    niệm ra đời từ một con ve, mở rộng thành định luật cho mọi giác quan từng tồn tại.
  en: >-
    Put a Na'vi and a human pilot in the same Pandoran forest at night and they will not share a
    world. The ground lights up beneath the Na'vi's every step; the pilot's instruments go blind in
    the churning magnetism. The question is not "who sees correctly?" but "why does neither of them
    see all of it?" — and the answer is an idea born from a tick, widened into a law that governs
    every sense that ever evolved.
