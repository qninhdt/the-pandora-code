slug: origins-of-life-on-pandora
status: published
title:
  vi: Nguồn gốc Sự sống trên Pandora
  en: Origins of Life on Pandora
subtitle:
  vi: >-
    Pandora giàu hơn Trái Đất nguyên thủy ở mọi thứ mà một nguồn gốc sự sống cần đến — nhiệt, hydro,
    lưu huỳnh, thời gian. Vậy mà bước khó nhất vẫn khó y như vậy, và lý do nằm ở chỗ nó không phải
    một sự thiếu hụt mà là một vòng tròn phụ thuộc.
  en: >-
    Pandora is richer than the early Earth in everything an origin of life is supposed to need —
    heat, hydrogen, sulfur, time. The hardest step was exactly as hard anyway, because it is not a
    shortage but a circular dependency.
hook:
  vi: >-
    Dưới đáy một đại dương Pandora, một ống khoáng nhạt màu đang lớn lên trong vùng nước chưa từng
    thấy ánh sáng. Không có gì ở đó còn sống. Nhưng đặt điện cực hai bên vách khoáng ấy, bạn sẽ đo
    được một hiệu điện thế cùng cỡ và cùng dấu với thứ mà mitochondria trong người bạn đang duy trì
    lúc này. Tảng đá đang chạy một cục pin — và câu hỏi là cục pin đó mua được những gì.
  en: >-
    On the floor of a Pandoran ocean, a pale mineral chimney is growing in water that has never seen
    light. Nothing there is alive. But put an electrode either side of one of its walls and you
    would measure a voltage of the same size and sign as the one your mitochondria are maintaining
    right now. The rock is running a battery — and the question is what a battery can buy.
