slug: materials-of-life
status: published
title:
  vi: Vật liệu Sự sống
  en: Materials of Life
subtitle:
  vi: >-
    Một cây cung ba mét, một cái cây ba trăm mét, một đôi cánh hai mươi lăm mét — cả ba đều là những
    tuyên bố về vật liệu, và vật liệu thì kiểm tra được. Bốn con số quyết định thứ gì có thể được
    dựng nên, và sinh học thắng không nhờ nguyên liệu tốt hơn mà nhờ cách sắp xếp giỏi hơn.
  en: >-
    A three-metre bow, a three-hundred-metre tree, a twenty-five-metre wing — each is a claim about
    materials, and materials can be checked. Four numbers decide what can be built, and biology wins
    not with better ingredients but with better arrangements.
hook:
  vi: >-
    Cây cung của người Na'vi dài gần ba mét, nặng chưa tới bốn kilogram, và cần một lực kéo mà không
    cánh tay người nào giữ được. Không một chi tiết nào trong nó được gia công; tất cả đều được mọc
    ra, ở nhiệt độ cơ thể, từ nước và đường. Vậy việc mọc ra thay vì chế tạo ra mua được cho ta
    những gì — và giới hạn của nó nằm ở đâu?
  en: >-
    A Na'vi bow is nearly three metres long, weighs under four kilograms, and needs a pull no human
    arm can hold. Nothing in it was machined; every part was grown, at body temperature, out of
    water and sugar. So what does growing rather than manufacturing actually buy — and where does it
    run out?
