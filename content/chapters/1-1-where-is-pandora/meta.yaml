slug: where-is-pandora
part: the-world
order: 1
status: published
title:
  vi: Pandora nằm ở đâu?
  en: Where Is Pandora?
subtitle:
  vi: >-
    Địa chỉ thực sự của Pandora trong hệ Alpha Centauri - và nghệ thuật săn tìm một thế giới mà
    chúng ta chưa thể nhìn thấy
  en: >-
    Pandora's real address in the Alpha Centauri system - and the art of hunting a world we cannot
    yet see
hook:
  vi: >-
    Đứng trên Pandora trước buổi trưa, bạn sẽ thấy mặt trời vụt tắt sau một bức tường vân mây khổng
    lồ che khuất một phần ba bầu trời. Bầu trời đó nói cho bạn biết rằng bạn không đứng trên một
    hành tinh - mà là trên một mặt trăng. Câu hỏi đặt ra đòi hỏi sự kiên nhẫn: chính xác thì nơi này
    nằm ở đâu - và liệu có thứ gì giống như vậy thực sự tồn tại ngoài kia, đủ gần để một ngày nào đó
    ta chĩa kính viễn vọng vào và biết được hay không?
  en: >-
    Stand on Pandora before midday and watch the sun go out behind a banded wall that fills a third
    of the sky. That sky tells you you are not on a planet but on a moon. The question is the
    patient one: where exactly is this place - and could anything like it really be out there, close
    enough that we might one day point a telescope at it and know?
