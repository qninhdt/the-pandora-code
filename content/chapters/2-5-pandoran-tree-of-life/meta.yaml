status: published
title:
  vi: Phả hệ sự sống Pandora
  en: Pandoran tree of life
subtitle:
  vi: >-
    Một nhà sinh học được trao toàn bộ bầy thú Pandora mà không có lấy một sợi DNA - liệu có thể
    dựng lại cây phả hệ của chúng? Có thể: bằng cách đọc những đặc điểm chung dẫn xuất theo lối phân
    nhánh, và bằng việc biết chính xác phương pháp ấy gãy ở đâu.
  en: >-
    A biologist is handed the whole Pandoran bestiary with no DNA - can she still rebuild their
    family tree? Yes: by reading shared derived traits cladistically, and by knowing exactly where
    the method breaks.
hook:
  vi: >-
    Trên một chiếc bàn mẫu vật tối mờ: hộp sọ thanator, một chiếc vây ilu, một đốt sống tulkun, và
    một bộ xương Na'vi đứng lẫn giữa chúng. Mọi nhà phát sinh chủng loài học trên Trái Đất hôm nay
    đều với tay tìm cùng một thứ trước tiên - và thứ đó đang vắng mặt: không có DNA. Cốt truyện gốc
    hoàn toàn im lặng về sinh học phân tử của Pandora. Vậy mà cây phả hệ vẫn dựng được - bởi suốt
    một thế kỷ trước khi biết giải trình tự gene, Trái Đất đã dựng cây sự sống của mình chỉ từ những
    bộ xương. Câu hỏi thật sự không phải "có biết được không", mà là: điểm giống nào tiết lộ quan hệ
    huyết thống, và điểm giống nào nói dối?
  en: >-
    On a dim specimen bench: a thanator skull, an ilu flipper, a tulkun vertebra, and a Na'vi
    skeleton standing among them. The one tool every Earth phylogeneticist now reaches for first is
    missing - there is no DNA. Canon is silent on Pandoran molecular biology. And yet the tree can
    still be drawn, because for a century before sequencing, Earth built its own tree of life from
    bones alone. The real question is not whether the tree is knowable, but which similarities
    reveal kinship - and which ones lie.
