slug: a-real-living-planet
status: published
title:
  vi: Một hành tinh đang thở đúng nghĩa
  en: Gaia After Eywa
subtitle:
  vi: >-
    Người Na'vi nói mọi nguồn năng lượng đều chỉ là đi mượn, rồi một ngày phải trả về cho cái toàn
    thể. Đó là thần học — hay là mô tả chính xác nhất từng có về một hành tinh tự điều hòa lấy chính
    mình?
  en: >-
    The Na'vi say all energy is only borrowed, and one day must be returned to the whole. That is
    theology — or it is the most exact description ever written of a planet that regulates itself.
hook:
  vi: >-
    Bốn chương trước, ta đã mổ xẻ từng cơ phận của Eywa: trí tuệ phân tán, mạng nấm rễ, băng thông,
    sức bền của mạng lưới. Giờ là lúc lắp chúng lại thành một câu hỏi duy nhất, lớn nhất — Pandora
    là một hành tinh *có* sự sống, hay một hành tinh *là* một cơ thể sống? Trái Đất đã chạm tới câu
    hỏi ấy trước, dưới một cái tên gây tranh cãi suốt nửa thế kỷ: Giả thuyết Gaia.
  en: >-
    Four chapters have dissected Eywa part by part: distributed cognition, the fungal web,
    bandwidth, the resilience of the mesh. Now we assemble them into a single, largest question — is
    Pandora a planet *with* life, or a planet that *is* a living thing? Earth reached that question
    first, under a name that has been fought over for half a century: the Gaia hypothesis.
