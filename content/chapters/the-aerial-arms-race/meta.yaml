slug: the-aerial-arms-race
status: published
title:
  vi: Nightwraith và cuộc chạy đua vũ trang trên trời
  en: The Aerial Arms Race
subtitle:
  vi: >-
    Bốn cánh trông như một bản nâng cấp. Khí động học nói ngược lại: cặp cánh thứ hai luôn phải trả
    giá. Câu hỏi không phải nó bay giỏi hơn hay không - mà nó được đánh đổi để giỏi việc gì.
  en: >-
    Four wings look like an upgrade. Aerodynamics says otherwise: a second pair always costs
    something. The question is not whether it flies better — it is what it was traded to be good at.
hook:
  vi: >-
    Ta quen nghĩ thêm cánh là thêm lực nâng. Nhưng một cánh đang nâng thân luôn để lại phía sau khối
    khí bị đẩy xuống, và mặt cánh nào bay trong khối khí đó đều làm việc kém hơn - nên gần như không
    con vật bay nào chọn bốn cánh để bay xa. Nightwraith của Varang chọn nó vì thứ khác: quyền điều
    khiển. Đọc được đánh đổi ấy là đọc được cả bầu trời Pandora.
  en: >-
    We assume more wings mean more lift. But a wing holding a body up always leaves sinking air
    behind it, and any surface flying inside that air works less well — which is why almost nothing
    that flies chooses four wings to go far. Varang's Nightwraith chose them for something else:
    control. Read that trade and you can read the whole Pandoran sky.
