slug: bodies-built-for-water
status: published
title:
  vi: Những cơ thể sinh ra để thuộc về biển cả
  en: Bodies Built for Water
subtitle:
  vi: >-
    Tộc Metkayina có cái đuôi mà lũ trẻ nhà Sully không thể tập mà có được. Nhưng phần lớn những gì
    làm nên một người lặn giỏi thì lại không nằm ở chỗ đó.
  en: >-
    The Metkayina have a tail the Sully children cannot train into existence. But most of what makes
    a diver is not kept there.
hook:
  vi: >-
    Tsireya dạy lũ trẻ rừng cách làm chậm nhịp tim trước khi chúng kịp xuống nước, và Ronal thì bảo
    đuôi chúng quá mảnh. Cả hai đều đúng — và khoảng cách giữa hai câu ấy chính là một trong những
    ranh giới sắc nét nhất của sinh học: đâu là phần cơ thể ta rèn được, đâu là phần buộc phải thừa
    hưởng.
  en: >-
    Tsireya teaches the forest children to slow a heartbeat before they touch the water, and Ronal
    says their tails are too thin. Both are right — and the distance between those two sentences is
    one of the sharpest lines in biology: which parts of a body can be trained, and which have to be
    inherited.
