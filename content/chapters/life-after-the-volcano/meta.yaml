slug: life-after-the-volcano
status: published
title:
  vi: Sự sống sau ngày tận thế
  en: Life After the Volcano
subtitle:
  vi: >-
    Một thế hệ đã trôi qua kể từ ngày ngọn núi chôn vùi quê hương tộc Mangkwan, mà vùng Tro tàn vẫn
    trơ trọi. Câu hỏi không phải vì sao nó chết — mà vì sao nó chưa sống lại.
  en: >-
    A generation has passed since the mountain buried the Mangkwan homeland, and the Ashlands are
    still bare. The question is not why it died — it is why it has not come back.
hook:
  vi: >-
    Ta quen nghĩ sự sống luôn quay lại: cháy rừng rồi rừng mọc, vết thương rồi liền da. Nhưng vùng
    Tro tàn của tộc Mangkwan đã trơ trọi suốt một thế hệ, và điều đó không phải là ngoại lệ kỳ lạ —
    đó là quy luật mà Trái Đất đã dạy ta ở sườn một ngọn núi lửa năm 1980. Phục hồi không phải một
    lời hứa; nó là một cuộc mặc cả với những gì còn sót lại dưới lòng đất.
  en: >-
    We assume life always comes back: a forest burns and regrows, a wound scars over. But the
    Mangkwan Ashlands have stayed barren for a generation, and that is no strange exception — it is
    the rule Earth taught us on the flank of one volcano in 1980. Recovery is not a promise; it is a
    bargain struck with whatever survived underground.
