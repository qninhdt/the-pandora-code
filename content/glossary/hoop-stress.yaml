cover_prompt: >-
  A cross-section through a thin muscular wall enclosing a pressurised cavity, circumferential fibre
  bands stretched visibly taut and thinning pale at the widest point, cyan glow from the compressed
  interior showing through the overstretched tissue, deep teal and indigo, painterly anatomical plate,
  no text, no labels.
