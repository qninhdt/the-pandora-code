cover_prompt: >-
  A naturalist diagram of a plant root and a fungal network as two trading partners, glowing tokens
  of carbon and phosphorus passing between them along balanced scales, a marketplace mood rendered in
  cool teal and amber against dark soil, painterly style, no text, no labels.
