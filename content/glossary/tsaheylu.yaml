id: tsaheylu
label:
  vi: Tsaheylu (Mối liên kết)
  en: Tsaheylu (the bond)
definition:
  vi: 'Mối liên kết thần kinh trực tiếp mà người Na''vi tạo ra khi đan các sợi tua trong queue của mình với sợi tua của một sinh vật khác - một con pa''li, một con ikran, hay một người Na''vi khác. Các đầu dây thần kinh hồng hồng cài vào nhau, mở ra một kênh truyền hai chiều theo thời gian thực: lệnh vận động, cảm giác, và cả cảm xúc cùng chảy qua. Nguồn cốt truyện ví nó như một "sợi cáp ethernet sinh học". Qua tsaheylu, con vật cưỡi trở thành phần nối dài của hệ cơ-xương-thần kinh của người cưỡi.'
  en: 'The direct neural link a Na''vi forms by interlacing the tendrils of their queue with those of another creature - a pa''li, an ikran, or another Na''vi. The pinkish nerve-endings interlock, opening a two-way real-time channel: motor commands, sensation, and emotion all flow across it. Canon likens it to a "biological ethernet cable." Through tsaheylu the mount becomes an extension of the rider''s own musculoskeletal and nervous system.'
see_also:
- queue
- operculum
category: bio
