cover_prompt: >-
  A painted illustration of a stone basin brimming with luminous teal liquid, a steady stream pouring
  in from above and an equal stream spilling from a notch at the rim so the level never changes, dark
  indigo surroundings, painterly naturalist plate, no text, no numbers, no labels.
