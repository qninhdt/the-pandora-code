cover_prompt: A painted chart-like study of a dark sea crossed by drifting current bands of different speeds, with one curving glowing track that bends far off the direct line to ride a fast band before turning toward a distant shore, cool teal and cyan on void-indigo, painterly, no text, no labels, no numbers.
