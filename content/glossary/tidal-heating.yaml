id: tidal-heating
label:
  vi: Nhiệt thủy triều
  en: Tidal heating
definition:
  vi: Nhiệt sinh ra bên trong một thiên thể khi trọng lực của vật thể mà nó quay quanh liên tục nhào nặn nó. Một mặt trăng trên một quỹ đạo hơi lệch tâm sẽ bị ép mạnh hơn khi nó tiến lại gần và nhẹ hơn khi nó lùi ra xa; sự co giãn nhịp nhàng đó làm ấm phần bên trong của nó nhờ ma sát. Đó là lý do tại sao mặt trăng Io của Sao Mộc lại phun trào dữ dội đến thế và Europa lại duy trì được một đại dương dưới lớp băng của mình - và, theo cốt truyện, đó cũng là thứ cung cấp động cơ nhiệt địa chất cho Pandora.
  en: Heat generated inside a body when the gravity of the object it orbits repeatedly kneads it. A moon on a slightly off-circular orbit is squeezed harder when it swings close and less when it swings far; that rhythmic flexing warms its interior by friction. It is why Jupiter's moon Io erupts so violently and Europa keeps an ocean under its ice - and, in canon, what drives Pandora's geological heat.
see_also:
