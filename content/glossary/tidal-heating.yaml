id: tidal-heating
label:
  vi: Nhiệt thủy triều
  en: Tidal heating
definition:
  vi: Nhiệt sinh ra bên trong một thiên thể khi lực hấp dẫn của vật thể nó quay quanh liên tục nhào nặn nó. Một mặt trăng có quỹ đạo hơi lệch tâm bị bóp mạnh khi đến gần và nhẹ hơn khi ra xa; sự uốn nắn nhịp nhàng đó làm nóng lòng thiên thể bằng ma sát. Đây là lý do mặt trăng Io của Sao Mộc phun trào dữ dội và Europa giữ được đại dương dưới băng - và trong cốt truyện, là nguồn nung nóng địa chất của Pandora.
  en: Heat generated inside a body when the gravity of the object it orbits repeatedly kneads it. A moon on a slightly off-circular orbit is squeezed harder when it swings close and less when it swings far; that rhythmic flexing warms its interior by friction. It is why Jupiter's moon Io erupts so violently and Europa keeps an ocean under its ice - and, in canon, what drives Pandora's geological heat.
see_also:
  - exomoon
  - roche-limit
category: concept
cover_prompt: >-
  A painted close view of a moon whose crust is split by glowing molten orange
  seams and cracks radiating heat from within, a huge banded gas giant looming
  dimly behind it. Cool palette with scarce ember-amber glow, painterly, no text
  or labels.
