cover_prompt: A painted night scene on an alien moon, a huge banded gas giant in a near-full phase washing the dark landscape below in soft reflected blue-green light, glowing bioluminescent plants beneath. Cool void-indigo palette, gentle reflected glow, painterly, no text, no labels, no numbers.
