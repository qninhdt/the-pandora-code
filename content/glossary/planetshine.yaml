id: planetshine
label:
  vi: Ánh sáng hành tinh
  en: Planetshine
definition:
  vi: Ánh sáng mặt trời phản chiếu từ một hành tinh lên mặt trăng của nó, thắp sáng nửa ban đêm của mặt trăng - rất giống với cách "ánh sáng Trái Đất" làm cho phần tối của Mặt Trăng lưỡi liềm mờ ảo hiện ra. Vì Polyphemus rất lớn và có tính phản chiếu cao, ánh sáng hành tinh của nó hắt lên Pandora sáng đến mức bán cầu hướng về hành tinh chủ hiếm khi chìm vào bóng tối thực sự - một áp lực tiến hóa đã góp phần định hình thế giới phát quang sinh học của nó.
  en: Sunlight reflected off a planet onto its moon, lighting the moon's night side - much like "earthshine" makes the dark part of a young crescent Moon faintly visible. Because Polyphemus is huge and highly reflective, its planetshine on Pandora is bright enough that the planet-facing hemisphere rarely goes truly dark - an evolutionary pressure that helped shape its bioluminescent world.
