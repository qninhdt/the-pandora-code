id: hydrothermal-ore-deposit
label:
  vi: Mỏ quặng nhiệt dịch
  en: Hydrothermal ore deposit
definition:
  vi: >-
    Mỏ khoáng sản sinh ra khi nước nóng lưu chuyển qua đá, hòa tan kim loại ở nơi này rồi kết tủa chúng ở
    nơi khác — và làm việc đó bền bỉ hàng triệu năm cho tới khi hàm lượng vượt xa mức trong đá thường hàng
    nghìn tới hàng vạn lần. Nước là nhân tố then chốt, nhưng nhiệt để duy trì dòng đối lưu ấy thường đến từ
    magma, còn magma giàu nước thì lại tập trung ở các ranh giới mảng. Đó là lý do những vành quặng giàu
    nhất Trái Đất nằm ở nơi đoán trước được, và cũng là lý do một thế giới có lớp vỏ bất động khó có nổi chúng.
  en: >-
    An ore body formed when hot water circulates through rock, dissolving metals in one place and precipitating
    them in another — and doing it persistently for millions of years, until the concentration runs thousands
    to tens of thousands of times above ordinary rock. Water is the essential agent, but the heat that keeps
    the circulation going usually comes from magma, and water-rich magma is concentrated at plate boundaries.
    That is why Earth's richest ore belts sit in predictable places, and why a world with an immobile crust
    struggles to make them.
