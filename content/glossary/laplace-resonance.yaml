id: laplace-resonance
label:
  vi: Cộng hưởng Laplace
  en: Laplace resonance
definition:
  vi: Một dạng cộng hưởng quỹ đạo ba thiên thể đặc biệt, được đặt tên theo ba mặt trăng trong của Sao Mộc là Io, Europa và Ganymede, khóa nhịp theo tỉ lệ 4:2:1 - Io quay bốn vòng, Europa hai và Ganymede một. Các cú kéo lặp lại đều đặn giữ cho quỹ đạo của chúng hơi lệch tâm, và chính điều đó duy trì hoạt động núi lửa dữ dội của Io. Pandora gần như chắc chắn cần một dàn xếp tương tự với các mặt trăng anh em của Polyphemus.
  en: A special three-body orbital resonance, named for Jupiter's inner moons Io, Europa, and Ganymede, locked in a 4:2:1 rhythm - Io laps four times for Europa's two and Ganymede's one. The steadily repeating tugs keep their orbits slightly eccentric, and that is what sustains Io's ferocious volcanism. Pandora almost certainly needs a similar arrangement with sibling moons of Polyphemus.
