cover_prompt: >-
  A painted diagram of three dense glowing clusters of nodes connected to each other by only one or
  two thin bridging links each, a clear sense of separate neighbourhoods, cool cyan and teal on dark
  indigo, painterly schematic, no text, no labels, no numbers.
