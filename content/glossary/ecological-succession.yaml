  A painterly naturalist plate showing a single hillside in four faint overlapping stages left to
  right — bare grey rock, first low cushion plants, taller shrubs, then a closed canopy — under a dim
  cyan-lit sky, no arrows, no text, no labels, no numbers, deep indigo ground.
