cover_prompt: >-
  A painterly naturalist plate of a glowing branching tree with one complete branch and every one of its twigs highlighted
  brightly, the rest of the tree dim, one neighbouring twig deliberately left dark outside the highlight, cool cyan and teal
  palette, no text, no labels, no numbers.
