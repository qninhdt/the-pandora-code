category: concept
cover_prompt: A painted balance scale, one pan holding a glowing carbon atom with four bright bonds and the other holding a faint dim alternative atom, the carbon side clearly weightier, cool teal and indigo palette with scarce amber, painterly, no text, no labels, no numbers.
