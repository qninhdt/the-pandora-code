cover_prompt: >-
  A painted diagram of two glowing clusters of cyan nodes joined by a single bright bridging node on
  the only link between them, that one node visibly critical, cool cyan and faint magenta on dark
  indigo ground, painterly schematic, no text, no labels, no numbers.
