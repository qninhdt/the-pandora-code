id: queue
label:
  vi: Queue (bím thần kinh)
  en: Queue
definition:
  vi: Một bộ phận phụ trợ thần kinh mang sự sống mọc ra từ phía sau gáy, được ôm ấp bởi một lớp vỏ bọc tóc nhạy bén, cho phép muôn loài Pandora thực hiện "tsahaylu" - một sự liên kết thần kinh trực diện với nhau và với Eywa. Hầu hết các loài vật thuộc mạng lưới đối xứng hai bên đều mang theo một cặp queue đâm chồi ở hai bên thái dương; người Na'vi và prolemuris thì chỉ có duy nhất một chiếc ở sau gáy - một trong những sự tiêu giảm khiến chúng trở nên lẻ loi khỏi bản thiết kế chung của hành tinh này.
  en: The living neural appendage growing from the back of the head, wrapped in a sensitive sheath of hair, that lets Pandoran creatures form tsahaylu - a direct neural bond with one another and with Eywa. Most animals of the bilateral lattice carry a pair of queues sprouting at the temples; the Na'vi and the prolemuris have only a single rear queue - one of the reductions that set them apart from the planet's shared template.
