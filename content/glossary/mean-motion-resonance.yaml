cover_prompt: A painted view of two moons of different sizes on nested circular orbits around a banded gas giant, caught aligned in a row on one side, faint glowing tick marks spaced evenly along each ring hinting at a 2-to-1 rhythm, cool indigo palette, painterly astronomical plate, no text or numbers.
