cover_prompt: >-
  A painterly naturalist plate of a bare grey volcanic surface of cooled lava and pumice under a dim
  sky, a single tiny pioneer plant in one sheltered crack, vast sterile rock all around, cool cyan and
  indigo tones, no text, no labels, no numbers.
