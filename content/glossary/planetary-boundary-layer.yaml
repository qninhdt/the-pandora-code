cover_prompt: A painted cross-section of dark forested ground under a shallow turbulent haze layer with visible eddies, a smooth clear sky above it, and one faster smooth stream gliding just over the haze at night, cool teal and void-indigo, painterly, no text, no labels, no numbers.
