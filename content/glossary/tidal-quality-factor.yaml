cover_prompt: A painted abstract of a rock sample being cyclically squeezed, with a small fraction of each squeeze shown leaking away as warm amber heat glow while the rest springs back as cool motion, cool indigo dominant with scarce ember-amber accent, painterly plate, no text or numbers.
