  - habitable-zone
  - alpha-centauri
category: planet
cover_prompt: A painted space scene of a small blue-green moon hanging close in front of an enormous banded gas giant that fills the background, the moon catching light on one side. Cool Pandora palette, cream-and-rust planet bands, soft painterly atmosphere, no text or labels.
