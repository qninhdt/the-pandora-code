id: exomoon
label:
  vi: Mặt trăng ngoại hệ
  en: Exomoon
definition:
  vi: Một mặt trăng quay quanh một hành tinh ở một hệ sao khác. Một mặt trăng ngoại hệ có thể sinh sống được phải cân bằng được bốn nguồn nhiệt - ánh sáng sao trực tiếp, ánh sáng sao phản chiếu từ hành tinh chủ, bức xạ hồng ngoại của chính hành tinh khí khổng lồ, và nhiệt thủy triều sinh ra bên trong nó - trong khi phải né tránh các vành đai bức xạ của hành tinh chủ. Pandora chính là một mặt trăng ngoại hệ như vậy. Cho đến nay, vẫn chưa có mặt trăng ngoại hệ nào được xác nhận chắc chắn.
  en: A moon that orbits a planet in another star system. A habitable exomoon must balance up to four heat sources - direct starlight, starlight reflected off its host planet, the gas giant's own infrared glow, and tidal heat generated within - while dodging the host planet's radiation belts. Pandora is exactly such an exomoon. As yet, no exomoon has been firmly confirmed.
see_also:
