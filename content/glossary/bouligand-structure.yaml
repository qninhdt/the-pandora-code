cover_prompt: A painterly naturalist cutaway of a layered fibrous block in which each successive layer is rotated slightly from the one below so the stack forms a slow spiral, a thin cyan crack corkscrewing through it, deep indigo ground, hand-painted texture, no text, no numbers, no labels.
