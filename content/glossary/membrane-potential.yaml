cover_prompt: >-
  A single painted cell in cross-section with a glowing membrane, positive and negative ion symbols
  arranged unevenly on either side, a soft voltage-gradient halo, cool cyan and faint magenta on
  dark indigo, schematic and luminous, no text, no labels, no numbers.
