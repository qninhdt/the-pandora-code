cover_prompt: >-
  A painted cross-section of a cold dense slab of crust bending steeply downward into warmer mantle rock,
  its deepest end noticeably darker and heavier-looking, the horizontal sheet behind it visibly stretched
  taut as it is drawn along, cool blue-grey slab against deep indigo mantle with faint amber at depth,
  painterly geological plate, no text, no labels, no arrows.
