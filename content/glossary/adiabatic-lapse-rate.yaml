cover_prompt: A painted scene of a tall mountainside with a parcel of glowing cloud rising along it, the cloud cooling and thinning only slightly as it climbs, lush vegetation persisting near the high summit. Cool teal and void-indigo, living teal foliage glow, painterly haze, no text, no labels, no numbers.
