cover_prompt: >-
  A painted cutaway of a rocky planet whose outer shell is one continuous unbroken crust with no rifts
  or trenches anywhere along it, slow convection loops turning beneath the shell without breaching it, a
  single enormous volcanic shield swelling at one point on the surface, deep indigo and dull stone-grey
  with faint amber below, painterly geological plate, no text, no labels.
