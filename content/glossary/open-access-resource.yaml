  A painterly plate of an open stretch of sea with a great many small vessel silhouettes converging
  from every direction toward one shrinking pale shoal at the centre, no boundary or barrier anywhere
  in the water, cool teal vessels on deep indigo, painterly naturalist plate, no text, no labels.
