cover_prompt: A painted scene of a rocky moon passing through curving magnetic field lines of a gas giant, faint circular eddy-current loops glowing dimly inside the moon, the glow deliberately weak to signal a small effect, cool indigo dominant with only a faint amber trace, painterly plate, no text or numbers.
