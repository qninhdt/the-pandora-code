  A dark muscular funnel nozzle seen close, a dense narrow stream of water leaving it and breaking
  into a chain of tight glowing vortex rings receding into deep indigo water, cool teal and cyan
  bioluminescent particles caught in the rotation, painterly naturalist plate, no text, no labels.
