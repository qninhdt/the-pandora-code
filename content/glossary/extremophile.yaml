  - shadow-biosphere
category: bio
cover_prompt: A painted scene of a vividly colored extreme hot spring, scalding turquoise and rust-orange microbial mats ringing steaming water in a barren mineral landscape, beautiful and forbidding, cool palette with scarce warm accents, painterly, no text, no labels, no numbers.
