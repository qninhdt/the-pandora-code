cover_prompt: >-
  A painterly naturalist plate of a plant cell in cutaway whose nucleus glows one colour and whose chloroplasts
  glow a clearly different colour, a faint lineage thread of the second colour trailing off toward a neighbouring
  plant, cool cyan and magenta palette, no text, no labels, no numbers.
