id: operculum
label:
  vi: Khe thở bên sườn
  en: Operculum
definition:
  vi: 'Cặp khe hở dọc hai bên mạn sườn của hầu hết các loài dã thú khổng lồ trên Pandora, luân chuyển không khí tiến thẳng vào phổi mà phớt lờ hoàn toàn vùng đầu. Kiểu sắp xếp này cho phép việc trao đổi khí diễn ra với hiệu suất cực kỳ khủng khiếp trong bầu khí quyển dày đặc của Pandora - ở những kẻ bay lượn như banshee, nó vận hành như một chiếc máy bơm một chiều hệt như hệ hô hấp của các loài chim. Nhưng cũng vì không có đường dẫn để sưởi ấm luồng khí tràn vào, các loài thở bằng nắp mang sườn này lại cực kỳ mong manh trước cái lạnh. Người Na''vi là ngoại lệ duy nhất: họ không hề có nắp mang sườn và hít thở thông qua một chiếc mũi.'
  en: 'The pair of breathing slits running down the flanks of most large Pandoran animals, feeding air straight to the lungs while bypassing the head entirely. The arrangement allows extremely efficient gas exchange in Pandora''s dense atmosphere - in flyers like the banshee it works as a one-way pump much like a bird''s respiratory system. But because there is no passage to warm incoming air, operculum-breathers are highly vulnerable to cold. The Na''vi are the sole exception: they have no opercula and breathe through a nose.'
