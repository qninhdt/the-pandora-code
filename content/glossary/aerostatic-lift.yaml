id: aerostatic-lift
label:
  vi: Lực nâng tĩnh
  en: Aerostatic lift
definition:
  vi: >-
    Lực nâng sinh ra từ chênh lệch mật độ chứ không từ chuyển động - thứ giữ một quả bóng bay trên trời
    trong khi lực nâng khí động (thứ giữ một chiếc cánh) đòi phải liên tục xẻ qua không khí. Độ lớn của
    nó bằng thể tích nhân với hiệu mật độ giữa khí bên trong và không khí bên ngoài. Hệ quả phản trực
    giác nhưng quyết định: khí bên trong nhẹ tới đâu hầu như không quan trọng, vì mọi khí nâng đều đã
    gần như không khối lượng khi đặt cạnh không khí. Hydro chỉ hơn heli chừng vài phần trăm. Thứ thật sự
    phải mua là thể tích.
  en: >-
    Lift generated by a difference in density rather than by motion — what holds a balloon up, as
    opposed to the aerodynamic lift that holds a wing up and demands continuous movement through the
    air. Its magnitude is the enclosed volume multiplied by the density difference between the gas
    inside and the air outside. The counterintuitive but decisive consequence is that how light the
    interior gas is barely matters, since every lifting gas is already nearly weightless compared with
    air: hydrogen beats helium by only a few per cent. What must actually be bought is volume.
