id: spermaceti
label:
  vi: Sáp đầu cá nhà táng
  en: Spermaceti
definition:
  vi: >-
    Chất sáp lỏng, trong, chứa trong một khoang lớn ở đầu cá nhà táng. Vai trò sinh học của nó vẫn
    còn tranh luận — có thể liên quan tới hội tụ âm khi định vị bằng tiếng vang, có thể tới điều
    chỉnh độ nổi. Vai trò kinh tế của nó thì không tranh luận gì: suốt thế kỷ 19 nó là dầu bôi trơn
    cao cấp và nguyên liệu làm nến không khói tốt nhất mà con người có, và người ta lấy nó bằng cách
    cắt đầu con vật rồi múc ra. Cả một ngành công nghiệp đi khắp các đại dương chỉ vì cái khoang ấy.
    Đây là tiền lệ chính xác nhất trên Trái Đất cho việc săn một loài động vật cỡ lớn, sống lâu, chỉ
    để lấy một chất lỏng nằm trong hộp sọ nó — kể cả ở chi tiết rằng phần còn lại của con vật đáng
    giá kém hơn nhiều so với thứ chứa trong đầu.
  en: >-
    A clear liquid wax held in a large chamber in the head of a sperm whale. Its biological role is
    still argued over — possibly acoustic focusing for echolocation, possibly buoyancy control. Its
    economic role was never in doubt: through the nineteenth century it was the finest lubricant and
    the best smokeless candle stock available, and it was obtained by severing the animal's head and
    bailing it out. An entire industry ranged across every ocean for that one chamber. This is the
    closest Earth precedent for hunting a large, long-lived animal solely for a fluid inside its
    skull — down to the detail that the rest of the animal was worth far less than what its head
    contained.
