cover_prompt: 'A painted panoramic strip showing biomes change across latitude: dense glowing rainforest in the centre, fading to dry open grassland, then to pale cold tundra at the edges. Cool teal-to-stone palette, painterly haze, no text, no labels, no numbers.'
