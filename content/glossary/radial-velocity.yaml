id: radial-velocity
label:
  vi: Vận tốc xuyên tâm
  en: Radial velocity
definition:
  vi: Một phương pháp săn hành tinh dựa trên việc đo sự chao đảo nhỏ bé của một ngôi sao. Cả ngôi sao và hành tinh đều quay quanh khối tâm chung của chúng, do đó ngôi sao hơi lắc qua lắc lại; khi nó tiến về phía chúng ta, ánh sáng của nó dịch chuyển sang màu xanh (blue-shift), khi nó lùi ra xa, ánh sáng dịch chuyển sang màu đỏ (red-shift) (hiệu ứng Doppler). Đọc sự thay đổi màu sắc nhịp nhàng đó sẽ cho biết chu kỳ quỹ đạo và khối lượng tối thiểu của hành tinh, nhưng không cho biết kích thước hay bầu khí quyển của nó.
  en: A planet-hunting method based on measuring a star's tiny wobble. Star and planet both orbit their shared centre of mass, so the star sways slightly; as it moves toward us its light shifts bluer, as it pulls away, redder (the Doppler effect). Reading that rhythmic colour-shift gives the planet's orbital period and a minimum mass, but not its size or its atmosphere.
