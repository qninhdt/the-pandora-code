category: concept
tags:
- network-science
cover_prompt: >-
  A dark indigo field of glowing cyan network nodes where a few central nodes have many threads
  radiating out and most nodes have only one or two, the difference in connection count visible at a
  glance, painterly and schematic, no text, no labels, no numbers.
