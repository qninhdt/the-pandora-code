cover_prompt: A painted high-altitude view of one narrow luminous ribbon of wind snaking across a dark curved horizon, thinning and bulging as it bends around a cold air mass far below, cool teal and cyan streaks on void-indigo, painterly motion blur, no text, no labels, no numbers.
