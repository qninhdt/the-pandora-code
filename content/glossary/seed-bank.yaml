cover_prompt: >-
  A painted naturalist study of glowing seeds buried in dark soil beneath a charred surface, some
  drifting upward like luminous spores, a sense of life held in reserve, cool cyan and teal on deep
  indigo ground, painterly, no text, no labels, no numbers.
