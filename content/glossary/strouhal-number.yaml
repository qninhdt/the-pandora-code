cover_prompt: >-
  A painterly overhead study of a broad flattened tail sweeping through dark water, leaving a chain of
  evenly spaced spiral vortices trailing behind it in the current, cool teal and cyan swirls against
  deep indigo, no text, no labels, no numbers, no arrows.
