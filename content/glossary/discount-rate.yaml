cover_prompt: >-
  A painterly plate of a row of identical coin discs receding into depth, each one rendered fainter
  and more transparent than the one before until the farthest is barely visible in the haze, cool teal
  metallic sheen with a warm amber highlight on the nearest coin, deep indigo behind, painterly
  naturalist plate, no text, no labels.
