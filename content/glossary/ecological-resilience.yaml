cover_prompt: >-
  A painted naturalist scene of a burned dark hillside with bright green and cyan shoots already
  rising from the ash, a sense of recovery after damage, cool teal and cyan against charred indigo
  ground, painterly and luminous, no text, no labels, no numbers.
