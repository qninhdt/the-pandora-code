cover_prompt: >-
  An extreme close view of a woven mat of hair-fine blood vessels, alternating strands running in opposite
  directions and pressed together along their length, warm amber tones bleeding into cool teal across the
  interface, deep indigo tissue around it, painterly anatomical plate, no text, no labels.
