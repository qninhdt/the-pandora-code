id: terrestrialization
label:
  vi: Sự lên cạn của thực vật
  en: Terrestrialization
definition:
  vi: >-
    Cuộc chuyển từ nước lên không khí của dòng dõi thực vật, và bộ phát minh mà nó đòi hỏi. Danh sách
    này ngắn nhưng không thứ nào có thể bỏ: một lớp cutin chống mất nước; vỏ bào tử bằng sporopollenin
    để sinh sản đi được trong không khí khô; khí khổng, vì một lớp da kín nước cũng cắt luôn nguồn
    carbon; rễ để neo và hút; sắc tố chắn tia cực tím; và cuối cùng là tế bào dẫn nước hóa gỗ, thứ giải
    quyết cả lực hút lẫn việc chống đỡ. Trên Trái Đất, chuỗi này diễn ra trong khoảng bảy mươi triệu
    năm, từ những bào tử giữa kỷ Ordovic đến hệ thực vật đã đứng thẳng của tầng đá Rhynie.
  en: >-
    The plant lineage's move from water into air, and the suite of inventions it required. The list is
    short and nothing on it is optional: a cuticle against water loss; a sporopollenin spore wall so
    reproduction could travel through dry air; stomata, because a watertight skin also cuts off the
    carbon supply; roots for anchorage and uptake; pigments to screen ultraviolet light; and finally
    lignified conducting cells, which solved suction and support together. On Earth the sequence ran
    over roughly seventy million years, from mid-Ordovician spores to the upright flora of the Rhynie
    Chert.
