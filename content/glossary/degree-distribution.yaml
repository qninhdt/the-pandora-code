cover_prompt: >-
  A painted schematic curve falling steeply from a tall left edge down to a long flat tail, drawn in
  glowing cyan over a dark indigo ground, with a few bright large dots near the top and a scatter of
  tiny dots along the tail, elegant and naturalist, no text, no labels, no numbers.
