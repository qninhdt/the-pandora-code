id: snow-line
label:
  vi: Vạch băng
  en: Snow line
definition:
  vi: Khoảng cách trong một đĩa tiền hành tinh nơi nhiệt độ vừa xuống dưới chừng 170 K và nước ngừng là hơi để đóng thành băng. Vượt vạch này, lượng vật liệu rắn khả dụng tăng lên nhiều lần, nên lõi các hành tinh khí chỉ có thể lớn nhanh ở phía ngoài. Bên trong vạch, mọi thứ lắp ghép nên đều khô - nước của một thế giới như vậy phải được chở tới sau.
  en: The distance in a protoplanetary disk where the temperature falls below about 170 K and water stops being vapour and freezes into ice. Beyond it, the available solid material multiplies, which is why giant-planet cores can only grow quickly on the far side. Inside it, everything that assembles comes out dry - such a world's water has to be delivered later.
