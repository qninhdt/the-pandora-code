cover_prompt: >-
  A painted close view of hot solid rock deforming, its mineral grains stretched and sheared into long
  smooth flow lines like slow-poured glass, no liquid pools anywhere, dull ember-amber warmth showing
  through deep teal-indigo shadow, painterly petrological plate, no text, no labels.
