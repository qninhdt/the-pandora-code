cover_prompt: >-
  A painterly naturalist plate of three marine organisms arranged as specimens - an encrusting
  sponge, a patterned cone snail shell, and a branching colonial growth - each with a single small
  luminous droplet drawn beside it, the droplets far smaller than the organisms, cool teal specimens
  with faint amber droplet glow on dark indigo, painterly naturalist plate, no text, no labels.
