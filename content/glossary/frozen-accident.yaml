id: frozen-accident
label:
  vi: Tai nạn đông cứng
  en: Frozen accident
definition:
  vi: Một đặc điểm của sự sống vốn không bị hóa học bắt buộc phải như vậy - một trong nhiều phương án đều khả dĩ - nhưng đã được chọn sớm một cách ngẫu nhiên rồi "đông cứng" lại, vì mọi thứ xây dựng sau đó đều phụ thuộc vào nó nên không thể đổi nữa. Bộ hai mươi axit amin, cách bộ mã di truyền gán từng bộ ba với từng axit amin, hay việc dùng ATP làm đồng tiền năng lượng đều có dáng dấp của tai nạn đông cứng. Đối lập với nó là tối ưu phổ quát - đặc điểm mà hóa học bắt buộc, nên bất kỳ sự sống nào cũng sẽ hội tụ về.
  en: A feature of life that chemistry did not force to be that way - one of several workable options - but which was picked early by chance and then "froze" in place, because everything built afterward came to depend on it and it could no longer be changed. The set of twenty amino acids, how the genetic code maps each triplet to an amino acid, and the use of ATP as the energy currency all look like frozen accidents. Its opposite is a universal optimum - a feature chemistry forces, so any life would converge on it.
