cover_prompt: >-
  A painted study of several hollow cylindrical protein shells with conical end caps, drawn very large as
  if under a microscope, pale and translucent against dark indigo water with faint cyan highlights along
  their ribs, painterly naturalist plate, no text, no labels, no numbers.
