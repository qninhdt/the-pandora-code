  A painterly split scene of a reef, one side dense with living coral laying down bright limestone,
  the other side gnawed and bored hollow by fish and sponges, a faint balance motif implied by the
  contrast, cool teal water and dark indigo, painterly naturalist plate, no text, no labels.
