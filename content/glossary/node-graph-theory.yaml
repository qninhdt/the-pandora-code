category: concept
tags:
- network-science
cover_prompt: >-
  A single bright glowing point of cyan light on a dark indigo ground, a few faint threads beginning
  to reach out from it toward unseen others, painterly and schematic, a sense of one unit in a larger
  web, no text, no labels, no numbers.
