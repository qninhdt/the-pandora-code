cover_prompt: >-
  A painted diagram of a wave travelling left to right through a column of rock while the rock itself
  displaces up and down across the path, drawn as a sideways-rippling ribbon of stone, the crests
  glowing teal against deep indigo, the ribbon terminating abruptly at a dark molten region on the
  right, painterly physics plate, no text, no labels, no arrows.
