cover_prompt: >-
  A painted three-dimensional wedge cut from a planet's interior, threaded by many faint crisscrossing
  ray lines, with a cool blue-teal slab-shaped region descending steeply through it and a warmer
  amber-tinged plume rising nearby, deep indigo background, painterly geophysical plate, no text, no
  labels, no colour scale bar.
