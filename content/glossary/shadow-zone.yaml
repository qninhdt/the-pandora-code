cover_prompt: >-
  A painted globe cross-section with faint curved ray paths spreading from a point at the top, the rays
  clearly reaching one arc of the surface and a wide arc of the far surface left completely dark and
  empty of rays, the dark arc rimmed in dim magenta, deep indigo interior with a paler molten central
  region, painterly geophysical plate, no text, no labels.
