cover_prompt: A painted view of a broad thin glowing disk of gas and dust seen at a shallow angle around a small bright newborn star, faint concentric rings and gaps visible in the dust, cyan and teal with a warm amber core, painterly astronomical plate, no text, no labels, no numbers.
