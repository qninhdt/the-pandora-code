id: protoplanetary-disk
label:
  vi: Đĩa tiền hành tinh
  en: Protoplanetary disk
definition:
  vi: >-
    Chiếc đĩa khí và bụi dẹt, đang quay quanh một ngôi sao vừa mới sinh, nơi mọi hành tinh và
    mặt trăng của nó được lắp ghép. Nó dẹt vì bảo toàn động lượng góc: khí rơi vào gần mặt phẳng
    xích đạo có quá nhiều chuyển động ngang để chạm tới tâm. Đĩa chỉ tồn tại chừng hai đến năm
    triệu năm - toàn bộ việc dựng hành tinh phải xong trước khi nó tan.
  en: >-
    The flattened, rotating disk of gas and dust around a newborn star in which all its planets
    and moons are assembled. It is flat because of angular momentum: gas falling in near the
    equatorial plane has too much sideways motion to reach the centre. Disks last only about two
    to five million years - all planet building has to finish before one disperses.
