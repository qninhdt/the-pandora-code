id: upwelling
label:
  vi: Hiện tượng nước trồi
  en: Upwelling
definition:
  vi: Quá trình nước dưới sâu dâng lên thay thế nước mặt bị đẩy đi. Dòng nước trồi thường lạnh và giàu dưỡng chất được tái sinh, vì vậy có thể tiếp nhiên liệu cho sinh vật phù du và cả một lưới thức ăn khi đi vào tầng có ánh sáng.
  en: The rise of deeper water to replace surface water that has moved away. Upwelled water is often cold and rich in regenerated nutrients, so it can fuel plankton and an entire food web when it reaches the sunlit layer.
