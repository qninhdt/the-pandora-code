id: quantum-locking
label:
  vi: Khóa lượng tử
  en: Quantum locking
definition:
  vi: 'Tên gọi phổ biến cho hệ quả vĩ mô của hiện tượng ghim từ thông: một chất siêu dẫn bị khóa cứng ở một vị trí và góc nghiêng cố định trong không gian - có khả năng lơ lửng tại chỗ, trượt không ma sát dọc theo một đường ray từ tính, hoặc thậm chí treo ngược bên dưới một nam châm.'
  en: 'The common name for the macroscopic consequence of flux pinning: a superconductor locked rigidly at a fixed position and tilt in space - able to hover fixed, glide frictionlessly along a magnetic track, or even hang upside down beneath a magnet.'
see_also:
  - flux-pinning
  - type-ii-superconductor
category: concept
cover_prompt: A superconducting puck hanging upside down beneath a magnetic rail at a fixed tilted angle, surrounded by cold vapor, as if bolted into empty space without touching the rail. Show the impossible-looking but rigid locked position in a real lab setup, with the subject centered and the geometry easy to read, no text or infographic treatment.
