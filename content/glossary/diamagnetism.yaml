id: diamagnetism
label:
  vi: Nghịch từ
  en: Diamagnetism
definition:
  vi: Xu hướng của vật chất đẩy yếu một từ trường, phát sinh từ chuyển động quỹ đạo của electron. Ở các vật liệu thông thường (như than chì nhiệt phân, nước, mô sống), lực này cực kỳ yếu và cần đến từ trường khổng lồ để tạo ra sự bay lơ lửng; một chất siêu dẫn là một vật liệu nghịch từ hoàn hảo, có thể bay lơ lửng ngay cả trong những từ trường yếu.
  en: The tendency of matter to weakly repel a magnetic field, arising from electron orbital motion. In ordinary materials (pyrolytic graphite, water, living tissue) it is extremely weak and needs huge fields to levitate; a superconductor is a perfect diamagnet, levitating even in weak fields.
see_also:
  - meissner-effect
  - superconductivity
category: concept
cover_prompt: A macro laboratory scene of a thin square of pyrolytic graphite levitating a few millimeters above four dark magnets, with magnetic field lines bending gently away from the material instead of passing through it. The effect should look delicate and real, emphasizing weak repulsion rather than spectacle, with no text or diagram labels.
