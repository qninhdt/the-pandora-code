id: great-oxidation-event
label:
  vi: Sự kiện Đại Oxy hóa
  en: The Great Oxidation Event
definition:
  vi: Bước ngoặt cách đây khoảng 2.4 tỷ năm khi vi khuẩn lam quang hợp lần đầu tiên bơm ra đủ oxy tự do để biến đổi bầu khí quyển Trái Đất từ một màn sương mù nghèo oxy, có tính khử thành một hỗn hợp phản ứng mạnh, giàu oxy mà chúng ta hít thở ngày nay. Oxy có tính ăn mòn dữ dội; sự hiện diện dai dẳng của nó chỉ có thể được duy trì khi sự sống liên tục bổ sung nó. Đây là bằng chứng lịch sử cho thấy một sinh quyển có thể làm lại không khí của cả một hành tinh - và là bối cảnh để đọc oxy như một dấu ấn sinh học.
  en: The turning point about 2.4 billion years ago when photosynthetic cyanobacteria first pumped out enough free oxygen to transform Earth's atmosphere from an oxygen-poor, reducing haze into the reactive, oxygen-rich mixture we breathe today. Oxygen is fiercely corrosive; its persistent presence can only be maintained by life constantly replenishing it. It is the historical proof that a biosphere can remake an entire planet's air - and the context for reading oxygen as a biosignature.
