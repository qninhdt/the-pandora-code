cover_prompt: >-
  A painted study of one immense old tree at the centre of a glowing underground web, fine threads
  radiating to many small saplings around it, the great tree lit warmest, cool teal-and-amber
  bioluminescent palette on a dark indigo ground, no text, no labels.
