id: hallelujah-mountains
label:
  vi: Dãy núi Hallelujah
  en: Hallelujah Mountains
definition:
  vi: Các hòn đảo đá khổng lồ lơ lửng của Pandora (tiếng Na'vi - Ayram alusìng), tập trung ở vùng Iknimaya. Cốt truyện giải thích sự lơ lửng của chúng là do lõi chứa khoáng vật siêu dẫn unobtanium nằm bên trong Dòng xoáy Từ thông (Flux Vortex) của hành tinh.
  en: Pandora's giant floating rock islands (Na'vi - Ayram alusìng), concentrated in the Iknimaya region. Canon explains their flight by superconducting unobtanium cores sitting within the planet's Flux Vortex.
see_also:
  - unobtanium
  - flux-pinning
category: planet
cover_prompt: 'A wide cinematic view of Pandora''s Hallelujah Mountains: colossal floating rock islands hanging in layered mist above jungle canopy, with faint blue glow deep inside exposed unobtanium cores and a subtle structured magnetic vortex in the sky around them. Focus on the scale, suspended mass, and physical plausibility of the floating terrain, with no text.'
