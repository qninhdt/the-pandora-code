cover_prompt: A painted scene of a dark serrated ridge with a train of smooth lens-shaped clouds standing in the sky downwind of it, each cloud marking a wave crest, and rough tumbling eddies sketched low beneath them, cool teal and cyan on void-indigo, painterly, no text, no labels, no numbers.
