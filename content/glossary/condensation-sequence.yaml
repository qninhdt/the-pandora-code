cover_prompt: A painted graded strip of mineral grains arranged from left to right, glassy pale refractory crystals then dark silicate and bright metallic flecks then dull sulfides then frost-coated icy grains, warm amber cooling into cyan across the sequence, painterly mineralogical plate, no text, no labels, no numbers.
