cover_prompt: A painted underwater diptych against dark water, on one side a tall three-dimensional kelp forest full of small fish glowing faint teal, on the other a flat bare rocky seafloor covered in dense spiny urchins under the same cold light, painterly naturalist plate, no text, no labels.
