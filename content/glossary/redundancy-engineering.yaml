category: concept
tags:
- network-science
cover_prompt: >-
  A painted study of three identical glowing components arranged in parallel, one dimmed while the
  others carry the load, a clean schematic sense of backups, cool cyan and faint teal on dark indigo,
  painterly, no text, no labels, no numbers.
