cover_prompt: >-
  A painted silhouette of a great rounded envelope drifting high above a dim cloud layer at dusk, a
  small gondola slung beneath it on fine lines, deep indigo and teal atmosphere with faint haze
  dissolving the horizon, painterly naturalist plate, no text, no labels, no numbers.
