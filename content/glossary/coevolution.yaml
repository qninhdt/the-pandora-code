id: coevolution
label:
  vi: Đồng tiến hóa
  en: Coevolution
definition:
  vi: Quá trình hai loài tác động lên nhau như những lực chọn lọc, mỗi sự thích nghi ở bên này lại thúc đẩy một đối sách ở bên kia, qua thời gian sâu thẳm. Trong cuộc chạy đua vũ trang giữa kẻ săn và con mồi, con mồi nhanh hơn chọn lọc cho kẻ săn nhanh hơn, lại chọn lọc cho con mồi nhanh hơn nữa; con mồi độc chọn lọc cho kẻ săn kháng độc, lại chọn lọc cho con mồi độc hơn. Báo và linh dương đã rượt nhau đến đôi chân nhanh nhất thảo nguyên. Trên Pandora, cùng cuộc đua ấy hiện ra ở chiến thuật bầy đàn của nantang đối lại giác quan và chiếc quạt của hexapede. Không bên nào thắng - bản thân cuộc đua chính là trạng thái cân bằng.
  en: The process by which two species act as selective forces on each other, each adaptation on one side driving a counter on the other across deep time. In the predator-prey arms race, faster prey select for faster hunters, which select for faster prey still; toxic prey select for toxin-resistant predators, which select for more toxic prey. The cheetah and the gazelle ran each other into the fastest legs on the plain. On Pandora the same race shows in the viperwolf's pack tactics answered by the hexapede's senses and fan. Neither side ever wins - the race itself is the equilibrium.
