cover_prompt: A painted array of nine tiny microfossil shapes - spirals, chambered shells, spiny spheres, toothed cones - laid out in a grid at high magnification against dark ground, pale cream forms with faint cyan rim light, painterly naturalist plate, no text, no labels.
