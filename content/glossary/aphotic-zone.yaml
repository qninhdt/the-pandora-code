cover_prompt: >-
  A vertical band of ocean showing colour vanishing with depth: warm reds and ambers extinguished in the
  topmost sliver, a narrow blue-green window persisting far below, then total void indigo darkness filling
  the lower two thirds, painterly naturalist plate, no text, no labels.
