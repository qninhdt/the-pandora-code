id: taphonomy
label:
  vi: Cổ sinh học chôn vùi (taphonomy)
  en: Taphonomy
definition:
  vi: 'Nghiên cứu tất cả những gì xảy ra với một cơ thể giữa lúc chết và lúc được phát hiện - phân hủy, bị ăn xác, bị dòng nước phân loại, bị vùi lấp, rồi biến đổi hóa học trong đá. Nhà cổ sinh vật học Liên Xô Ivan Efremov đặt tên cho nó năm 1940, và ý tưởng cốt lõi của ông mới là điều đáng nhớ: những "tai nạn" ngăn giữa nhà khoa học và bằng chứng không phải là nhiễu, chúng *chính là* bằng chứng. Hiểu quy luật của chúng thì các khoảng trống trong hồ sơ hóa thạch cũng nói lên nhiều điều như bản thân hóa thạch.'
  en: 'The study of everything that happens to a body between death and discovery - decay, scavenging, hydraulic sorting, burial, and the chemical changes that follow inside rock. The Soviet paleontologist Ivan Efremov named it in 1940, and his central insight is the part worth keeping: the accidents standing between a scientist and the evidence are not noise, they *are* the evidence. Learn their rules and the gaps in a fossil record become as informative as the fossils.'
