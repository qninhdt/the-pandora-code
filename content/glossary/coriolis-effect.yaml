cover_prompt: A painted view looking down on a spinning planet with a few smooth flow lines starting straight from the equator and curving gently sideways as they travel toward the pole, the curvature traced in soft glowing streaks. Cool teal and void-indigo, painterly, no text, no labels, no numbers.
