cover_prompt: >-
  A painterly naturalist plate of two unrelated plants touching at the root, a fine glowing thread of genetic
  material passing from one into the other across the contact, their separate lineage lines running upward
  apart, cool teal and amber palette, no text, no labels, no numbers.
