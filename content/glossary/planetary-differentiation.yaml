id: planetary-differentiation
label:
  vi: Sự phân tầng hành tinh
  en: Planetary differentiation
definition:
  vi: Quá trình mà một thiên thể nóng chảy tách thành các lớp theo mật độ - kim loại nặng chìm xuống tạo thành lõi, đá nhẹ hơn nổi lên tạo thành lớp manti và lớp vỏ. Nó thiết lập cấu trúc bên trong của một hành tinh; đối với Pandora, vụ va chạm cổ đại được cho là đã phá vỡ chính cái lõi sắt-niken phân tầng rất rõ ràng đó.
  en: The process by which a molten body separates into layers by density - heavy metal sinks to form a core, lighter rock rises to form mantle and crust. It sets a planet's internal structure; for Pandora, the ancient impact is said to have disrupted that very differentiated nickel-iron core.
see_also:
  - accretion
  - tidal-heating
  - unobtanium
category: planet
cover_prompt: A painted cutaway of a molten young world showing a bright dense core sinking beneath glowing mantle layers, warm amber core against cool indigo rock, painterly cross-section plate, no text, no labels, no numbers.
