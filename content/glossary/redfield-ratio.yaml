cover_prompt: >-
  A painted microscopy plate of marine plankton — glassy diatoms and delicate radiolarian shells —
  suspended in dark water, three of them lit in graded intensities of teal, cyan and amber to suggest
  proportion, painterly naturalist illustration, no text, no numbers, no labels.
