id: r-process
label:
  vi: Bắt neutron nhanh
  en: Rapid neutron capture
definition:
  vi: >-
    Con đường nhanh tới những nguyên tố nặng nhất: trong mảnh vụn đầy neutron của một vụ sáp
    nhập sao neutron, hạt nhân hấp thụ neutron nhanh hơn tốc độ chúng phân rã, chỉ trong khoảng
    một giây, và bị đẩy xa khỏi vùng bền tới tận urani. Năm 2017 con người quan sát trực tiếp
    quá trình này lần đầu. Vàng, bạch kim, thori và urani trong vỏ một hành tinh đều ra đời như
    vậy.
  en: >-
    The fast route to the heaviest elements: in the neutron-drenched debris of a neutron-star
    merger, nuclei absorb neutrons faster than they can decay, over roughly one second, and are
    driven far past stability all the way to uranium. The process was observed directly for the
    first time in 2017. The gold, platinum, thorium and uranium in a planet's crust were all
    made this way.
