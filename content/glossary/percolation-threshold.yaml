category: concept
tags:
- network-science
cover_prompt: >-
  A painted moment of a glowing cyan network grid snapping apart, the left half still one connected
  whole and the right half scattering into disconnected islands, a sharp dividing line of transition,
  dark indigo ground, painterly and dramatic, no text, no labels, no numbers.
