id: splenic-contraction
label:
  vi: Lách co bóp giải phóng hồng cầu
  en: Splenic contraction
definition:
  vi: >-
    Khi cơ thể nín thở, lá lách bóp lại và tống lượng hồng cầu nó đang giữ vào dòng máu — một ngân
    hàng máu nằm ngay trong ổ bụng. Ở người, lách giảm 15–40% thể tích trong vòng 30–60 giây, đẩy
    hematocrit từ khoảng 42% lên 45–46% và thêm chừng 50–100 mL oxy: đủ cho 15 đến 30 giây nín thở
    nữa. Con số ấy có thật, nhưng khiêm tốn — và đó là điều đáng nhớ. Ở hải cẩu, lá lách phình to giữ
    tới 60% toàn bộ khối hồng cầu, đủ để đẩy hematocrit lên 65–70% khi lặn, biến máu thành một thứ
    đặc sánh chở oxy mà không phải trả giá độ nhớt lúc nghỉ trên mặt nước.
  en: >-
    When a body holds its breath, the spleen squeezes and pushes the red cells it was storing into
    circulation — a blood bank sitting in the abdomen. In humans the spleen loses 15–40% of its volume
    within 30–60 seconds, lifting haematocrit from about 42% to 45–46% and adding roughly 50–100 mL of
    oxygen: enough for another fifteen to thirty seconds of breath-hold. The effect is real but
    modest, and that modesty is the thing worth remembering. In seals the spleen is enlarged enough to
    hold up to 60% of all their red cells, driving haematocrit to 65–70% on a dive — an oxygen-dense
    slurry, with none of the viscosity cost paid while resting at the surface.
