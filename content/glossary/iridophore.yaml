cover_prompt: >-
  A steep cutaway through skin revealing a stack of thin parallel reflective plates with fluid gaps between
  them, incoming pale light splitting into cyan and teal iridescent bands as it leaves the stack, deep indigo
  tissue around it, painterly naturalist microscopy plate, no text, no labels.
