id: serotiny
label:
  vi: Trữ hạt trên tán chờ lửa (serotiny)
  en: Serotiny
definition:
  vi: >-
    Chiến lược giữ hạt lại trên cây trong những quả hay nón được nhựa gắn kín, chỉ mở ra khi bị nung
    quá một ngưỡng nhiệt, thường vào khoảng 60-80 °C. Nghe như đánh cược nguy hiểm, nhưng thời điểm
    mở lại chính xác đến mức đáng nể: hạt rơi xuống một lớp đất vừa được dọn sạch bằng lửa, đã bón
    sẵn tro giàu khoáng, và tạm thời không còn đối thủ cạnh tranh nào chen chỗ. Nhiều loài thông và
    hầu hết chi Banksia ở Úc theo lối này, trong đó Banksia còn có kiểu mở nón khô-ướt xen kẽ sau
    cháy. Đây là ví dụ sạch sẽ nhất cho ý rằng cây không chỉ sống sót qua lửa mà còn hẹn giờ sinh sản
    theo lửa.
  en: >-
    The habit of holding seed on the plant inside resin-sealed cones or fruits that open only when
    heated past a threshold, typically around 60-80 °C. It sounds like a dangerous wager, but the
    timing is remarkably precise: the seed drops into a bed that fire has just cleared, fertilised
    with mineral-rich ash, and left temporarily free of competitors. Many pines and most Australian
    Banksia work this way, with Banksia adding cycles of wetting and drying to prise the follicles
    open after the burn. It is the cleanest example of a plant not merely surviving fire but timing
    its reproduction to it.
