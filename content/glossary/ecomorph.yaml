id: ecomorph
label:
  vi: Dạng hình sinh thái
  en: Ecomorph
definition:
  vi: 'Một dạng hình thể được đúc nặn bởi chính phân mảnh môi trường mà loài sinh vật đó khai thác, chứ không phải do thừa hưởng từ tổ tiên - những loài chiếm giữ những hốc sinh thái tương tự thường mang chung một dáng vẻ dẫu chúng chẳng phải họ hàng gần. Lũ thằn lằn Anolis ở vùng Caribe là minh chứng hoàn hảo nhất: trên mỗi quần đảo Đại Antilles, chúng lại phân tách thành khoảng sáu hình thái lặp đi lặp lại - một loài chuyên sống cành nhỏ, một loài sống bám thân-gốc cây - nhưng những hình thái giống nhau giữa các hòn đảo lại chẳng hề chung dòng máu. Thanator, viperwolf và banshee chính là những ecomorph của riêng Pandora.'
  en: 'A body-type defined by the part of the environment an organism exploits rather than by ancestry - species occupying the same kind of niche tend to share a form even when they are not close relatives. The Caribbean''s Anolis lizards show it best: on each of the Greater Antilles they split into the same roughly six recurring forms - a twig type, a trunk-ground type - yet matching forms across islands are not close kin. The thanator, viperwolf and banshee are Pandora''s ecomorphs.'
