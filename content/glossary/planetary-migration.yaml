id: planetary-migration
label:
  vi: Di trú hành tinh
  en: Planetary migration
definition:
  vi: Sự dịch chuyển quỹ đạo của một hành tinh khi nó trao đổi động lượng góc với chiếc đĩa khí nó đang nằm trong. Hàng trăm hành tinh khí thật đã được tìm thấy ở gần ngôi sao chủ hơn nhiều so với chỗ chúng có thể hình thành, và di trú là lý do. Polyphemus gần như chắc chắn đã dựng lõi ở ngoài vạch băng rồi mới trôi vào chỗ các bộ phim tìm thấy nó.
  en: The orbital drift of a planet as it exchanges angular momentum with the gas disk it sits in. Hundreds of real exoplanets have been found far closer to their stars than they could possibly have formed, and migration is why. Polyphemus almost certainly built its core beyond the snow line and only then drifted inward to where the films find it.
