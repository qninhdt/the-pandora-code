  A painterly naturalist scene of a vivid crowded coral reef teeming with fish in the foreground
  against vast empty clear-blue open ocean behind, the contrast between richness and barrenness
  made visual, cool teal palette with faint cyan glow, painterly plate, no text, no labels.
