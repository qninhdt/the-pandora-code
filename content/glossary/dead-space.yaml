id: dead-space
label:
  vi: Khoảng chết
  en: Dead space
definition:
  vi: Phần không khí bị mắc kẹt trong đường dẫn khí - khí quản, phế quản - không bao giờ chạm tới bề mặt trao đổi và do đó không tham gia hô hấp. Mỗi nhịp thở thủy triều đều lãng phí một phần vào khoảng chết này, kéo hiệu suất xuống. Đó là một trong những lý do lá phổi ra-vào của động vật có vú thua kém luồng khí một chiều của loài chim, vốn gần như không có khí tù đọng.
  en: The portion of air trapped in the conducting airways - windpipe, bronchi - that never reaches the exchange surface and so takes no part in breathing. Every tidal breath wastes some of itself on dead space, dragging efficiency down. It is one reason the mammal's in-and-out lung loses to the bird's one-way flow, which leaves almost no stale air behind.
