id: cursorial
label:
  vi: Chuyên chạy
  en: Cursorial
definition:
  vi: 'Từ mô tả một con vật được tiến hóa nhào nặn để chạy - chạy nhanh, chạy bền, hay cả hai. Cơ thể chuyên chạy có những dấu hiệu rất dễ đọc: chân dài và mảnh để mỗi sải bước phủ được nhiều đất, khối lượng dồn lên cao gần thân để đầu chân nhẹ và vung nhanh, ngón chân tiêu giảm (ngựa Trái Đất rút còn một móng guốc duy nhất), và những sợi gân dài tích trữ năng lượng đàn hồi như lò xo sinh học. Ngựa, đà điểu, chó sói đều là kẻ chuyên chạy. Con pa''li trên Pandora khoác đủ bộ dấu hiệu ấy - nhưng ở quy mô một con voi, nhờ bộ xương sợi carbon giữ cho cẳng chân vẫn thon dài thay vì hóa thành cột trụ.'
  en: 'A word for an animal that evolution has shaped to run - fast, far, or both. Cursorial bodies wear telltale marks: long slender legs so each stride covers more ground, mass carried high near the trunk so the far end of the limb stays light and swings fast, reduced toes (Earth''s horse is down to a single hoof), and long tendons that bank elastic energy like biological springs. Horses, ostriches, and wolves are all cursorial. Pandora''s pa''li wears the full set of marks - but at the scale of an elephant, its carbon-fibre skeleton keeping the legs slim and long rather than turning them into pillars.'
