cover_prompt: A painted eruption scene showing a towering ash column rising tens of kilometers into a dark sky above a collapsing volcanic cone, glowing molten fissures at its base, ash spreading over the land, cool indigo sky with scarce ember-amber glow from the vent, painterly plate, no text or numbers.
