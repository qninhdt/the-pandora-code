category: concept
tags:
- network-science
cover_prompt: >-
  A painted web of glowing cyan nodes where one vast connected mass fills most of the frame, with a
  few small isolated clusters drifting dark at the edges, deep indigo ground, painterly and luminous,
  no text, no labels, no numbers.
