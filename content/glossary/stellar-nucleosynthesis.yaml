id: stellar-nucleosynthesis
label:
  vi: Tổng hợp hạt nhân trong sao
  en: Stellar nucleosynthesis
definition:
  vi: Việc chế tạo các nguyên tố nặng hơn heli bằng phản ứng nhiệt hạch trong lòng sao và trong những cái chết dữ dội của chúng. Các sao khối lượng lớn dựng nên oxy, magie, silic và canxi trong vài triệu năm ngắn ngủi; sắt đến muộn hơn từ những vụ nổ khác. Toàn bộ lớp manti và lõi của Pandora là sản phẩm tích lũy của nhiều thế hệ sao đã chết trước khi hệ này hình thành.
  en: The manufacture of every element heavier than helium by fusion inside stars and in their violent deaths. Massive stars build oxygen, magnesium, silicon and calcium in a few short million years; iron arrives later from a different kind of explosion. Pandora's entire mantle and core are the accumulated output of generations of stars that died before its system existed.
