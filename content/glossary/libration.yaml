cover_prompt: A painted sequence suggestion of a banded gas giant low over an alien horizon, shown gently nodding and rocking to slightly different positions, as if seen over one slow orbit. Cool void-indigo sky, faint bioluminescent foreground glow, painterly, no text, no labels, no numbers.
