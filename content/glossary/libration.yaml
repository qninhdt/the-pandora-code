id: libration
label:
  vi: Sự bình động
  en: Libration
definition:
  vi: Sự lắc lư và gật gù chậm chạp của một thiên thể bị khóa thủy triều khi nhìn từ hành tinh chủ của nó. Mặc dù trung bình nó chỉ hướng một mặt về phía hành tinh chủ, quỹ đạo không tròn hoàn hảo khiến nó lúc thì chạy trước lúc thì tụt lại phía sau (bình động theo kinh độ), và độ nghiêng trục cho phép người quan sát lần lượt nhìn qua các cực bắc và nam của nó (bình động theo vĩ độ). Sự bình động là lý do tại sao chúng ta nhìn thấy khoảng 59% bề mặt Mặt Trăng từ Trái Đất thay vì chính xác là một nửa.
  en: The slow rocking and nodding of a tidally locked body as seen from its host. Though it shows one face on average, an off-circular orbit makes it run ahead and lag behind (libration in longitude), and an axial tilt lets the viewer peer over its north and south poles in turn (libration in latitude). Libration is why we see about 59% of the Moon's surface from Earth rather than exactly half.
see_also:
  - tidal-locking
  - synchronous-rotation
  - obliquity
category: concept
