id: hypercapnia
label:
  vi: Chứng tăng CO2 máu (Hypercapnia)
  en: Hypercapnia
definition:
  vi: Tình trạng dư thừa carbon dioxide (CO₂) trong máu. Thông thường, cơ thể xả CO₂ vào phổi vì không khí bên ngoài hầu như không chứa khí này; nhưng khi không khí xung quanh giàu CO₂, dòng chảy đảo ngược và CO₂ tràn vào trong, tạo thành axit carbonic và làm máu bị axit hóa. Cuống não phản ứng bằng cách thúc đẩy nhịp thở nhanh hơn - một phản xạ trở thành cái bẫy tử thần khi mỗi hơi thở chỉ nạp thêm chất độc. Đây là một trong hai kẻ sát nhân trực tiếp trong không khí của Pandora.
  en: An excess of carbon dioxide in the blood. Normally the body offloads CO₂ into the lungs because the outside air holds almost none; but when the surrounding air is rich in CO₂, the flow reverses and CO₂ floods inward, forming carbonic acid and turning the blood acidic. The brainstem responds by driving faster breathing - a reflex that becomes a death trap when every breath only adds more poison. It is one of the two immediate killers in Pandora's air.
