id: radiative-equilibrium
label:
  vi: Cân bằng bức xạ
  en: Radiative equilibrium
definition:
  vi: Trạng thái trong đó một hành tinh bức xạ trở lại không gian lượng năng lượng bằng đúng lượng nó nhận được từ ngôi sao chủ, nhờ đó nhiệt độ trung bình của nó giữ mức ổn định. Từ lượng ánh sáng tới và suất phản chiếu, bạn có thể tính toán được "nhiệt độ cân bằng" - mức nhiệt độ nền mà một thế giới sẽ có nếu không có bầu khí quyển. Một hiệu ứng nhà kính sau đó sẽ nâng nhiệt độ thực tế lên trên mức nền đó, và trên Pandora, một bầu khí quyển dày đặc đã nâng mức này lên một khoảng rất lớn.
  en: The state in which a planet radiates exactly as much energy to space as it receives from its star, so its average temperature holds steady. From the incoming light and the albedo you can compute an 'equilibrium temperature' - the baseline a world would sit at with no atmosphere. A greenhouse then lifts the real temperature above that baseline, and on Pandora a dense atmosphere lifts it a great deal.
