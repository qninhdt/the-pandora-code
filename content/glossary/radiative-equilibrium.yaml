cover_prompt: A painted scene of a small planet in space with soft arrows of bright starlight arriving on one side and dim warm infrared glow leaving on the other in equal measure, the world held in steady balance. Cool void-indigo space, ember-amber outgoing glow, painterly, no text, no labels, no numbers.
