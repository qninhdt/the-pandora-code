id: bit
label:
  vi: Bit
  en: Bit
definition:
  vi: >-
    Đơn vị cơ bản của thông tin, do Shannon đặt tên (rút gọn của "binary digit"). Một
    bit là lượng thông tin vừa đủ để chọn giữa hai khả năng đồng xác suất - một câu trả
    lời có/không, một lần tung đồng xu công bằng. Mọi thông điệp, dù là một dòng chữ, một
    bức ảnh, hay toàn bộ ký ức của một đời người, đều có thể quy về một số đếm bit. Chính
    nhờ đơn vị chung này mà ta có thể hỏi một câu tưởng chừng vô lý: một tâm trí nặng bao
    nhiêu bit?
  en: >-
    The fundamental unit of information, named by Shannon (short for "binary digit"). One
    bit is exactly the information needed to choose between two equally likely
    alternatives - a yes/no answer, a fair coin flip. Any message - a line of text, a
    photograph, or the whole memory of a life - can be reduced to a count of bits. It is
    this shared unit that lets us ask a question that sounds absurd: how many bits is a
    mind?
