cover_prompt: >-
  A painterly naturalist cross-section of a tropical reef, a living veneer of branching and massive
  corals atop pale accreted limestone rock riddled with cavities, small fish sheltering in the
  structure, cool teal water above and dark below, faint cyan glow along the living rim, no text,
  no labels.
