cover_prompt: A painterly naturalist plate of a single flake of black volcanic glass on dark stone, its broken face showing smooth concentric ripple ridges catching cyan and ocean teal light, one long edge thinning to near invisibility with a faint magenta glint, deep indigo background, no text, no labels.
