cover_prompt: >-
  A painterly study of two young figures of the same build seen underwater, one with visibly narrowed
  pupils and a clear steady gaze, the other squinting into blur, the water between them the same cool
  teal, deep indigo depth behind, no text, no labels, no numbers.
