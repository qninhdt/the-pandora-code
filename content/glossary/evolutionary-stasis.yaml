id: evolutionary-stasis
label:
  vi: Trì trệ tiến hóa
  en: Evolutionary stasis
definition:
  vi: Trạng thái một loài hầu như không thay đổi về hình thái trong những khoảng thời gian rất dài, thay vì liên tục biến đổi. Trên Trái Đất, các thế giới địa chất năng động thường buộc sinh vật phải thay đổi nhanh. Theo cốt truyện, người Na'vi xuất hiện khoảng 12 triệu năm trước và gần như không đổi từ đó - một sự đứng yên mà Eywa được cho là chủ động duy trì, không có tiền lệ nào trên Trái Đất.
  en: A state in which a species changes little in form over very long spans, rather than continually transforming. On Earth, geologically active worlds tend to force life to change quickly. In canon the Na'vi appeared about 12 million years ago and have barely changed since - a stillness Eywa is said to actively maintain, with no Earthly precedent.
see_also:
  - prolemuris
  - deep-time
category: bio
cover_prompt: A painted scene of an ancient creature standing perfectly still in a glowing Pandoran forest while faint ghostly layers of time pass around it unchanged, cool teal-cyan bioluminescent palette, painterly naturalist plate, no text.
