id: speculation
label:
  vi: Suy đoán
  en: Speculation
definition:
  vi: Trong cuốn sách này, đây là cấp độ phân loại dành cho một mô hình hợp lý nhưng dựa trên một tiền đề chưa được xác nhận - một khi đã chấp nhận tiền đề đó, mô hình phải tuân thủ mọi định luật còn lại. Một sự suy đoán có kỷ luật chỉ thay đổi chính xác một biến số và bắt tất cả những yếu tố còn lại phải trả đúng giá (bảo toàn năng lượng, nhiệt động lực học, hóa học). Khi một thế giới bẻ cong một quy luật rồi sau đó coi như mọi quy tắc đều vô hiệu, suy đoán sẽ thối rữa thành kỳ ảo.
  en: In this book, the classification tier for a plausible model resting on an unconfirmed premise - granted once, then held to every remaining law. Disciplined speculation changes exactly one variable and makes the rest pay full price (energy conservation, thermodynamics, chemistry). When a world bends one rule and then assumes all rules are off, speculation rots into fantasy.
see_also:
  - abduction
  - falsifiability
category: concept
cover_prompt: A single small floating island held aloft by one bright luminous teal thread to the dark sky, while ordinary waterfalls, rock layers, and a distant flying creature around it behave normally under gravity. Convey one granted impossibility surrounded by physics still obeyed in full, painterly and literal, no text.
