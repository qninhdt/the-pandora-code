cover_prompt: >-
  A painterly study of a translucent sphere suspended in a dark indigo fluid, a faint cyan outline
  showing the volume of fluid it has pushed aside and small upward-curving streamlines gathering
  beneath it, hand-painted texture, no text, no labels, no numbers.
