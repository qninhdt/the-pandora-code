cover_prompt: >-
  A painted cross-section where an oceanic plate bends down beneath a thicker continental plate, forming a
  deep narrow trench at the surface, with a chain of glowing volcanic cones rising on the overriding plate
  inland of the trench and small bright points marking earthquakes along the descending sheet, deep indigo
  mantle, amber volcanic light, painterly geological plate, no text, no labels.
