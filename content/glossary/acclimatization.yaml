cover_prompt: >-
  A painterly diptych of the same human figure standing in cold shallow water, on one side lit with a
  faint warm inner glow of raised metabolism, on the other cool and unlit, the two halves separated only
  by a shift in light, deep indigo water and pale mist, no text, no labels, no numbers.
