  - reaction-diffusion
category: bio
tags:
  - developmental-biology
cover_prompt: >-
  A painted horizontal strip of cells over a fading gradient arrow, the strip dividing into three
  crisp color zones like a flag, glowing cyan to teal to deep indigo, schematic and luminous on dark
  ground, no text, no labels, no numbers.
