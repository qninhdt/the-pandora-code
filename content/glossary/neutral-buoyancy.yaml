cover_prompt: >-
  An enormous pale-bellied marine animal hanging perfectly motionless in mid water, no seafloor and no
  surface visible, its wings relaxed and level, faint cyan bioluminescent particles suspended around it
  at the same stillness, deep void indigo and ocean teal, painterly naturalist plate, no text, no labels.
