cover_prompt: A painterly naturalist plate showing four small structural elements arranged in a row against deep indigo — a taut cord, a horizontal beam bending slightly, an upright column, and a curved bow limb — each glowing a different cool hue, hand-painted texture, no text, no numbers, no labels.
