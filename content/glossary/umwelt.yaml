category: concept
cover_prompt: A painted naturalist diagram of a small animal at the centre of a faint perceptual bubble, a richly detailed forest beyond the bubble drawn in muted grey and ignored, only a few cues rendered vivid inside, cool teal and cyan against deep indigo, no text, no labels, no numbers.
