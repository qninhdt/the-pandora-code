  - mother-tree-hypothesis
category: concept
cover_prompt: >-
  A painted diagram of two trees joined by a glowing underground thread, faint particles drifting
  net from a bright sunlit tree toward a dim shaded one along a gentle gradient, cool teal palette
  on a dark indigo ground, no text, no labels.
