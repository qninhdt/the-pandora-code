cover_prompt: >-
  A painted salamander-like embryo mapped with a gradient of glowing membrane-voltage colors, cool
  cyan hyperpolarized regions outlining a future face and warm regions elsewhere, schematic and
  luminous against dark indigo, no text, no labels, no numbers.
