id: transmission-spectroscopy
label:
  vi: Quang phổ truyền qua
  en: Transmission spectroscopy
definition:
  vi: Một kỹ thuật dùng ánh sáng để đọc cấu tạo bầu khí quyển của một hành tinh xa xôi. Khi hành tinh đi ngang qua mặt ngôi sao của nó, một dải ánh sáng sao hẹp len lỏi qua bầu khí quyển của nó trên đường truyền tới chúng ta; mỗi loại khí hấp thụ ánh sáng ở những bước sóng đặc trưng, để lại một "dấu vân tay" trong quang phổ. Phân tách ánh sáng đó và bạn có thể đọc được công thức không khí của một thế giới mà bạn không bao giờ có thể đặt chân tới. Kính viễn vọng Không gian James Webb sử dụng phương pháp này để phát hiện CO₂, hơi nước, và methane trên các ngoại hành tinh.
  en: A technique for reading a distant planet's atmospheric composition by light. As the planet crosses the face of its star, a thin sliver of starlight strains through its atmosphere on the way to us; each gas absorbs light at characteristic wavelengths, leaving a "fingerprint" in the spectrum. Split that light and you read the air recipe of a world you can never visit. The James Webb Space Telescope uses this method to detect CO₂, water vapour, and methane on exoplanets.
