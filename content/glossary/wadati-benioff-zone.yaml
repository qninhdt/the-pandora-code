cover_prompt: >-
  A painted cross-section of a planet's outer few hundred kilometres with a narrow deep trench at the surface
  and a long inclined plane of small bright points descending from it far into the darker interior, the points
  thinning out with depth, cyan pinpoints against deep indigo rock, painterly geophysical plate, no text, no
  labels, no depth scale.
