cover_prompt: 'A painted cross-section of a planet''s tropics showing one big loop of air: warm air rising in a tall plume of glowing cloud at the centre, spreading out high above, and sinking into clear dry sky to either side. Cool teal cloud, void-indigo sky, painterly, no text, no labels, no numbers.'
