cover_prompt: >-
  A painted cross-section of a tall mountain range with a vastly larger pale wedge of light rock extending
  downward beneath it into darker denser rock, the underground portion visibly several times the height of
  the visible peaks, cool teal highlights on the summits, deep indigo at depth, painterly geological plate,
  no text, no labels, no measurement lines.
