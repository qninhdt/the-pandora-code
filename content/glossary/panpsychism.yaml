id: panpsychism
label:
  vi: Thuyết phiếm tâm
  en: Panpsychism
definition:
  vi: >-
    Quan điểm cho rằng ý thức là một thuộc tính nền tảng, hiện diện khắp nơi trong vật chất - từ electron, nguyên tử cho tới các thiên hà - chứ không phải thứ chỉ đột nhiên xuất hiện ở những bộ não đủ phức tạp. Dưới lăng kính phiếm tâm, ý tưởng về một hành tinh có ý thức nghe ra không hề vô lý, vì mọi thứ đều mang sẵn một tia trải nghiệm tối thiểu. Tuy nhiên khoa học hiện đại phần lớn cưỡng lại quan điểm này, kiên quyết đòi hỏi những điều kiện về cấu trúc và kiến trúc (như vòng phản hồi quặt ngược) thì một hệ thống mới có ý thức - chứ không phải cứ tồn tại là có.
  en: >-
    The view that consciousness is a fundamental property present everywhere in matter - from electrons and atoms up to galaxies - rather than something that suddenly appears only in sufficiently complex brains. Through the panpsychist lens, the idea of a conscious planet sounds far from absurd, since everything carries at least a spark of minimal experience. Modern science, however, largely resists this, insisting on structural and architectural prerequisites (like recurrent feedback) before a system counts as conscious - not mere existence.
