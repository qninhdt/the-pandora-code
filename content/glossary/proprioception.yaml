id: proprioception
label:
  vi: Cảm thụ bản thể
  en: Proprioception
definition:
  vi: 'Giác quan thầm lặng cho ta biết các bộ phận cơ thể đang ở đâu và làm gì mà không cần nhìn - lý do bạn chạm được ngón tay vào mũi khi nhắm mắt. Nó dựa trên những thụ thể nằm trong cơ, gân và khớp, liên tục báo về não độ căng và góc của từng phần thân thể, dệt nên một tấm bản đồ cơ thể nằm dưới ngưỡng ý thức. Nó hiếm khi được nhắc đến chỉ vì nó chẳng bao giờ tắt. Trên Pandora, đây chính là giác quan mà tsaheylu nối dài: khi người Na''vi kết nối với một con ikran, đôi cánh và thân mình con vật hòa vào tấm bản đồ cơ thể của người cưỡi, được cảm nhận như chính chân tay mình.'
  en: 'The silent sense that tells you where your body parts are and what they are doing without looking - the reason you can touch a finger to your nose with your eyes shut. It runs on receptors in the muscles, tendons, and joints that continuously report tension and joint angle to the brain, weaving a body-map that sits below conscious awareness. It goes unmentioned only because it never switches off. On Pandora it is the sense tsaheylu extends: when a Na''vi bonds with an ikran, the animal''s wings and body fold into the rider''s own body-map, felt as if they were her own limbs.'
see_also:
  - tsaheylu
  - umwelt
category: bio
cover_prompt: A painted study of a Na'vi arm and hand reaching in the dark with faint glowing lines tracing along the muscles and joints, suggesting an inner body-sense, cool teal and cyan against deep indigo, no text, no labels, no numbers.
