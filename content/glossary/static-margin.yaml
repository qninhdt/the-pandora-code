cover_prompt: A painted side profile of a dark winged body balanced on a knife edge, one glowing cyan dot marking its centre of mass ahead of a hollow ring marking the neutral point, a faint curved arrow showing the nose being pushed back down, deep indigo background, painterly plate, no text, no labels.
