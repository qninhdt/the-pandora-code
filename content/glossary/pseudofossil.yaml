cover_prompt: A painted pair of side-by-side rock specimens whose forms look almost identical - one a genuine branching organic trace, the other a radiating mineral crystal growth - cool stone-grey and indigo with faint teal on one and warm amber on the other, painterly comparison plate, no text, no labels.
