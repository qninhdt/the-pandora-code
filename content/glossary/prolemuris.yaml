id: prolemuris
label:
  vi: Prolemuris
  en: Prolemuris
definition:
  vi: Một loài linh trưởng sống trên cây ở Pandora, có cặp chi trước phía trên hợp nhất một phần - một dạng chuyển tiếp nối liền sơ đồ sáu chi phổ biến của động vật Pandora với sơ đồ bốn chi của người Na'vi. Prolemuris gợi ý rằng người Na'vi tiến hóa từ một tổ tiên sáu chi chung, khi áp lực sống trên vòm cây ưu ái việc hợp nhất chi trước để tăng sự khéo léo.
  en: An arboreal Pandoran primate whose upper forelimbs are partly fused - a transitional form linking the six-limbed body plan common to Pandoran animals with the four-limbed plan of the Na'vi. Prolemuris suggests the Na'vi evolved from a shared six-limbed ancestor, where life in the forest canopy favored fusing the forelimbs for dexterity.
see_also:
  - evolutionary-stasis
category: bio
cover_prompt: A painted naturalist study of a slender arboreal creature in a glowing Pandoran canopy, its upper arms partly merged near the shoulder, twin forearms below, cool teal bioluminescent palette, painterly plate, no text.
