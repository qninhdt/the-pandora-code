id: prolemuris
label:
  vi: Prolemuris
  en: Prolemuris
definition:
  vi: Một loài linh trưởng sống trên vòm cây Pandora với cặp chi trước phần nào dung hợp vào nhau - một dạng chuyển tiếp kết nối thiết kế cơ thể sáu chi phủ sóng khắp muôn thú Pandora với thiết kế bốn chi của người Na'vi. Prolemuris hé lộ rằng người Na'vi cũng bắt nguồn từ một tổ tiên chung sáu chi, nơi mà lối sống leo trèo giữa các tán rừng đã ưu ái cho sự dung hợp chi trước để đổi lấy một sự khéo léo vượt bậc.
  en: An arboreal Pandoran primate whose upper forelimbs are partly fused - a transitional form linking the six-limbed body plan common to Pandoran animals with the four-limbed plan of the Na'vi. Prolemuris suggests the Na'vi evolved from a shared six-limbed ancestor, where life in the forest canopy favored fusing the forelimbs for dexterity.
