cover_prompt: >-
  A painterly naturalist plate of four separate fossil plant fragments laid apart on dark stone, a detached leaf, a length of
  trunk, a root mass and a cone, faint ghostly outlines showing they belong to one single tall plant, cool teal and indigo
  palette, no text, no labels, no numbers.
