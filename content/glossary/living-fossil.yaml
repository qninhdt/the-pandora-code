cover_prompt: >-
  A painterly naturalist plate of a single fan-leaved tree standing unchanged while faint ghosted outlines of the same tree
  recede behind it into deep time, its glowing internal threads shown shifting and rearranging, cool teal and amber palette,
  no text, no labels, no numbers.
