id: partial-pressure
label:
  vi: Áp suất riêng phần
  en: Partial pressure
definition:
  vi: Phần áp suất mà một loại khí đơn lẻ đóng góp vào một hỗn hợp - bằng tỷ lệ phần trăm của nó nhân với tổng áp suất (định luật Dalton). Cơ thể phản ứng không phải với "tỷ lệ phần trăm" oxy mà là với áp suất riêng phần của nó, tức là lực đẩy oxy từ không khí vào máu. Do đó, cùng một tỷ lệ phần trăm oxy có thể hít thở được ở một áp suất này nhưng lại gây ngạt thở ở một áp suất thấp hơn, giống như trên đỉnh Everest.
  en: The share of pressure a single gas contributes to a mixture - its fraction multiplied by the total pressure (Dalton's law). The body responds not to the "percentage" of oxygen but to its partial pressure, the push that drives oxygen from the air into the blood. So the same oxygen percentage can be breathable at one pressure yet suffocating at a lower one, as atop Everest.
see_also:
  - hypercapnia
category: concept
tags:
- physiology
