cover_prompt: >-
  A painted sprawling network with a few enormous glowing cyan hub nodes and a vast scatter of tiny
  faint nodes linked into them, an organic uneven structure, deep indigo void, painterly and
  atmospheric, no text, no labels, no numbers.
