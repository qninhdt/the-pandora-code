cover_prompt: >-
  A painterly anatomical plate of two small mammals lying side by side with a fine surgical junction
  of shared vessels running between their flanks, a faint luminous flow drawn passing in both
  directions along that junction, cool teal bodies with warm amber blood glow on dark indigo,
  painterly naturalist plate, no text, no labels.
