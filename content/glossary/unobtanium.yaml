id: unobtanium
label:
  vi: Unobtanium
  en: Unobtanium
definition:
  vi: Khoáng vật hư cấu của Pandora, được mô tả là có khả năng siêu dẫn ở nhiệt độ phòng. Các lõi unobtanium là nguyên nhân chính thức trong mạch truyện giúp các ngọn núi lơ lửng được; tính siêu dẫn ở nhiệt độ phòng vẫn là một điều chưa đạt được trong khoa học Trái Đất thực tế.
  en: Pandora's fictional mineral, described as superconducting at room temperature. Unobtanium cores are canon's stated cause for the floating mountains; room-temperature superconductivity remains unachieved in real Earth science.
see_also:
  - superconductivity
  - hallelujah-mountains
category: planet
cover_prompt: A fractured chunk of unobtanium embedded in dark Pandoran rock, the broken face revealing a dense quasi-crystalline interior with blue bioluminescent veins and countless tiny voids catching the light. It should read as a rare alien mineral with real mass and structure, not a fantasy crystal icon, with no text.
