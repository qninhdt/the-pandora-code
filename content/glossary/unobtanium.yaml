id: unobtanium
label:
  vi: Unobtanium
  en: Unobtanium
definition:
  vi: Khoáng chất hư cấu của Pandora, được mô tả là siêu dẫn ở nhiệt độ phòng. Lõi unobtanium trong dãy Hallelujah là nguyên nhân canon đưa ra cho việc chúng bay; tính siêu dẫn ở nhiệt độ phòng vẫn là điều khoa học Trái Đất chưa đạt được.
  en: Pandora's fictional mineral, described as superconducting at room temperature. Unobtanium cores are canon's stated cause for the floating mountains; room-temperature superconductivity remains unachieved in real Earth science.
see_also:
  - superconductivity
  - hallelujah-mountains
category: planet
cover_prompt: >-
  A fractured chunk of unobtanium embedded in dark Pandoran rock, the broken
  face revealing a dense quasi-crystalline interior with blue bioluminescent
  veins and countless tiny voids catching the light. It should read as a rare
  alien mineral with real mass and structure, not a fantasy crystal icon, with
  no text.
