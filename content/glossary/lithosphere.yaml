cover_prompt: >-
  A painted vertical cross-section through the outer few hundred kilometres of a rocky planet, the
  upper band rendered as brittle fractured plate with sharp cracks, grading downward into a softer
  band whose texture flows in smooth slow swirls, cool indigo and teal above warming to faint amber
  below, painterly geological plate, no text, no labels.
