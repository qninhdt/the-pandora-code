id: meissner-effect
label:
  vi: Hiệu ứng Meissner
  en: Meissner effect
definition:
  vi: Sự kiện một chất siêu dẫn chủ động đẩy lùi toàn bộ từ trường ra khỏi bên trong nó khi được làm lạnh dưới nhiệt độ tới hạn (nghịch từ hoàn hảo). Lực đẩy này có thể nâng một nam châm lên nhưng không mang lại sự ổn định ngang - nếu chỉ có nó thì sự lơ lửng sẽ không ổn định.
  en: A superconductor actively expelling all magnetic field from its interior when cooled below its critical temperature (perfect diamagnetism). The repulsion can lift a magnet but gives no lateral stability - on its own it yields unstable levitation.
see_also:
  - superconductivity
  - flux-pinning
  - diamagnetism
category: concept
tags:
- physics
cover_prompt: A polished superconducting disc cooled in vapor, lifting a small dark magnet above its surface while smooth blue magnetic field lines are visibly expelled outward and around the disc instead of entering it. The scene should read as pure magnetic exclusion and perfect diamagnetism, in a clean laboratory close-up with no labels.
