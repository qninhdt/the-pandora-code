id: inference-to-the-best-explanation
label:
  vi: Suy luận về lời giải thích tốt nhất
  en: Inference to the best explanation
definition:
  vi: 'Hình thức sắc bén hơn của suy luận hồi tố theo Gilbert Harman: trong số các giả thuyết đối thủ cùng giải thích một sự thật, hãy chấp nhận giả thuyết giải thích nó tốt nhất. "Tốt nhất" được cân nhắc bởi các tiêu chí - khả năng kiểm chứng, phạm vi, tính bảo thủ (phù hợp với những gì chúng ta đã có lý do chắc chắn để tin tưởng), và tính đơn giản (Dao cạo Occam). Nếu không có những tiêu chí này, "tốt nhất" sẽ sụp đổ thành "cái mà tôi tình cờ thích".'
  en: 'Gilbert Harman''s sharpened form of abduction: among rival hypotheses that explain the same fact, accept the one that explains it best. Best is weighed by criteria - testability, scope, conservatism (fitting what we already have strong reason to believe), and simplicity (Occam''s razor). Without those criteria, best collapses into the one I happen to like.'
see_also:
  - abduction
  - occams-razor
category: concept
tags:
- philosophy-of-science
cover_prompt: Three translucent glowing diagrams hovering side by side over a dark indigo surface, two dim and tangled, the third clean and bright in teal light, with a soft cyan beam selecting the brightest one. Convey choosing the strongest explanation from competing options, painterly and literal, no text or labels.
