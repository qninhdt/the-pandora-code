cover_prompt: A painted cross-section of a dark seafloor thick with massive sponges and a towering kelp stipe rising through cold teal water, dozens of small fish and invertebrates sheltering among their bodies, the large organisms glowing faintly as the structure everything else depends on, painterly naturalist plate, no text, no labels.
