cover_prompt: >-
  A painted geological cross-section of a thick dark crust pierced by several narrow vertical channels of
  glowing molten rock reaching the surface, fresh lava sheets stacked in visible layers at the top with
  the deepest layers bent downward under their weight, ember-amber conduits against deep indigo cold
  rock, painterly plate, no text, no labels, no arrows.
