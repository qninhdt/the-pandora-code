category: concept
tags:
- network-science
- ecology
cover_prompt: >-
  A painted diagram of a network where darkness spreads node by node in a chain reaction, bright
  cyan nodes going dark in a propagating wave, a sense of avalanche, cool cyan fading to void-indigo
  with faint magenta at the failure front, painterly schematic, no text, no labels, no numbers.
