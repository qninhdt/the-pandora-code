cover_prompt: >-
  A painted panel comparing two planetary surfaces in profile, the upper one showing high broad plateaus
  abruptly dropping to a deep flat sea floor at a clearly separate level, the lower one showing a single
  gently undulating surface with no distinct second level, cool teal seas and deep indigo depths, painterly
  geological plate, no text, no labels, no graph axes.
