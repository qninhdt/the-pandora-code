id: intertropical-convergence-zone
label:
  vi: Đới hội tụ liên chí tuyến
  en: Intertropical Convergence Zone
definition:
  vi: 'Vành đai quanh xích đạo nơi gió tín phong của hai bán cầu gặp nhau, đẩy không khí ẩm ấm bốc lên. Đây là nhánh bốc lên của hoàn lưu Hadley: hơi nước ngưng tụ và trút mưa gần như mỗi ngày, đó là lý do tại sao các khu rừng mưa nhiệt đới rậm rạp nhất Trái Đất lại bám dọc theo nó. Trên một thế giới quay chậm như Pandora, vành đai mưa đó mở rộng thành một dải nhiệt đới rộng lớn chứ không phải là một vạch hẹp.'
  en: 'The belt around the equator where the trade winds of the two hemispheres meet, forcing warm moist air upward. This is the rising branch of the Hadley cell: water vapour condenses and falls as near-daily rain, which is why Earth''s densest rainforests cling to it. On a slow-spinning world like Pandora, that rain belt broadens into a vast tropical band rather than a narrow stripe.'
see_also:
  - hadley-cell
  - atmospheric-general-circulation
  - biome
category: concept
cover_prompt: A painted equatorial scene of a thick band of towering storm cloud running across the middle of a view, heavy rain falling beneath it onto dense glowing forest, clearer sky above and to the sides. Cool teal and void-indigo, living teal forest glow, painterly haze, no text, no labels, no numbers.
