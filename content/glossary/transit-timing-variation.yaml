id: transit-timing-variation
label:
  vi: Sự biến thiên thời gian đi qua
  en: Transit-timing variation
definition:
  vi: Một phương pháp gián tiếp để phát hiện một mặt trăng (hoặc hành tinh) ẩn giấu. Khi một hành tinh đi ngang qua mặt ngôi sao của nó, một mặt trăng quay quanh hành tinh đó sẽ kéo nó dao động quanh khối tâm chung của chúng, khiến hành tinh đến điểm vạch chéo ngang qua ngôi sao sớm hơn hoặc muộn hơn một chút so với chu kỳ trước. Những sự dịch chuyển thời gian đó - chỉ từ vài giây đến vài phút đối với một mặt trăng cỡ Trái Đất - là dấu vân tay của thiên thể ẩn giấu đó, nhưng hiện nằm ngay ở ranh giới độ nhiễu của những công cụ tốt nhất ngày nay.
  en: An indirect way to detect a hidden moon (or planet). As a planet transits the face of its star, a moon orbiting it tugs the planet around their shared centre of mass, making the planet arrive at the crossing a little early or late from one transit to the next. Those timing shifts - only seconds to minutes for an Earth-sized moon - are the fingerprint of the hidden body, but sit right at the noise floor of today's best instruments.
see_also:
  - radial-velocity
  - exomoon
category: concept
cover_prompt: A painted scene of a banded gas giant crossing in front of a bright star, with a small moon beside it subtly tugging it off-centre, against deep space. Cool palette, soft painterly glow, no text, no clock, no arrows, no labels.
