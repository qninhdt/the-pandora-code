cover_prompt: A painted side view of a planet's curved atmosphere with large smooth looping bands of moving air, warm air rising near the middle and cool air sinking to either side, soft streamlines tracing the loops. Cool teal and void-indigo palette, painterly haze, no text, no labels, no numbers, no arrows with letters.
