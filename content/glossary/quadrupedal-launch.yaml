id: quadrupedal-launch
label:
  vi: Cất cánh bốn chân
  en: Quadrupedal launch
definition:
  vi: 'Cách rời mặt đất mà các loài dực long khổng lồ gần như chắc chắn đã dùng: thay vì nhảy bằng hai chân sau như chim, chúng chống cả bốn chi và bật người lên không bằng chính đôi chi trước cực khỏe — như một vận động viên nhảy sào. Điểm tài tình là đôi chi trước dùng để bật cũng chính là đôi chi mang cánh, nên không có khối lượng cất cánh nào trở thành gánh nặng vô dụng khi đã bay. Nhà cổ sinh vật học Mike Habib cho rằng chính mẹo này giúp dực long to hơn mọi loài chim. Banshee và toruk, lao mình khỏi vách núi cao trên đôi chi-cánh, thừa hưởng đúng chiến lược ấy.'
  en: 'The way the giant pterosaurs almost certainly left the ground: instead of leaping off the hind legs as a bird does, they planted all four limbs and vaulted into the air off their powerful forelimbs — like a pole-vaulter. The genius is that the forelimbs doing the launching are the same limbs that carry the wings, so no launch muscle becomes useless dead weight in flight. The palaeontologist Mike Habib argues this is why pterosaurs could outgrow every bird. Banshees and the toruk, vaulting off a high crag on their wing-limbs, inherit the same strategy.'
