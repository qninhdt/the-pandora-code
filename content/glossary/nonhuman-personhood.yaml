id: nonhuman-personhood
label:
  vi: Tư cách nhân vị phi nhân
  en: Nonhuman personhood
definition:
  vi: >-
    Ý niệm pháp lý rằng một thực thể không phải con người vẫn có thể là chủ thể có quyền, chứ không phải
    đối tượng của quyền sở hữu. Khác biệt so với luật phúc lợi động vật là cốt lõi: luật phúc lợi điều
    chỉnh cách người ta được đối xử với động vật trong khi vẫn coi nó là tài sản, còn tư cách nhân vị
    thì phủ nhận chính tư cách tài sản đó. Các tiền lệ trên Trái Đất còn rời rạc nhưng có thật: tòa
    Argentina năm 2014 công nhận đười ươi Sandra là "nhân vị phi nhân"; Ấn Độ năm 2013 tuyên bố cá heo
    là nhân vị phi nhân và cấm các bể trình diễn; New Zealand năm 2017 công nhận sông Whanganui là một
    pháp nhân có người đại diện. Tòa phúc thẩm New York thì bác đơn cho voi Happy năm 2022, với hai ý
    kiến bất đồng.
  en: >-
    The legal idea that a non-human entity can be a rights-bearing subject rather than an object of
    property. The difference from animal-welfare law is the crux: welfare law regulates how animals may
    be treated while keeping them property, whereas personhood denies that property status outright. Earth
    precedents are scattered but real: an Argentine court in 2014 recognised Sandra the orangutan as a
    "non-human person"; India in 2013 declared dolphins non-human persons and banned performance tanks;
    New Zealand in 2017 recognised the Whanganui River as a legal person with appointed guardians. New
    York's highest court, meanwhile, rejected the petition for Happy the elephant in 2022, over two
    dissents.
