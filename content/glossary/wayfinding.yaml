cover_prompt: A painted night scene of an outrigger canoe on dark open ocean, the horizon ringed by evenly spaced points of starlight and long swell crests crossing at an angle beneath the hull, a single seabird low in the sky, cool teal and cyan on void-indigo, painterly, no text, no labels, no numbers.
