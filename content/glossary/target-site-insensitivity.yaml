cover_prompt: A painted molecular study of a membrane pump protein shown twice side by side, on one a toxin molecule locking snugly into its binding pocket and on the other the same pocket subtly reshaped so the toxin drifts away unbound, teal and magenta against deep indigo, painterly, no text, no labels, no numbers.
