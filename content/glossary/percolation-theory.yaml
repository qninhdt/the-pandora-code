category: concept
tags:
- network-science
cover_prompt: >-
  A painted grid of glowing cyan dots with many removed at random, the connected cluster still barely
  spanning the field, a sense of a system on the verge of breaking apart, dark indigo ground,
  painterly and schematic, no text, no labels, no numbers.
