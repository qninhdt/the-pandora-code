cover_prompt: >-
  A painterly study of a face just below a dark water surface, eyes closed, faint cool light on the
  cheekbones, and beneath the skin a suggestion of glowing vessels drawing inward toward the chest
  while the limbs fade into shadow, deep indigo and teal, no text, no labels, no numbers.
