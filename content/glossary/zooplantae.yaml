cover_prompt: >-
  A painterly naturalist specimen plate of a glowing Pandoran organism that is half plant and half animal in character, a
  broad photosynthetic blade above and fine contractile fibres visible in its stalk below, dark specimen space around it,
  cool teal and magenta palette, no text, no labels, no numbers.
