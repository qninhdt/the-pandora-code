id: nagoya-protocol
label:
  vi: Nghị định thư Nagoya
  en: Nagoya Protocol
definition:
  vi: >-
    Hiệp định quốc tế có hiệu lực từ năm 2014, quy định ai được phép lấy vật liệu sinh học từ đâu và
    phải trả lại những gì. Nó dựng trên ba trụ: phải xin phép trước từ cơ quan có thẩm quyền của nước
    cung cấp và từ cộng đồng bản địa liên quan; phải thương lượng một hợp đồng nêu rõ điều khoản truy
    cập, các khoản chi theo mốc và tiền bản quyền; và phải chia sẻ lợi ích công bằng, cả bằng tiền lẫn
    bằng chuyển giao năng lực nghiên cứu. Nó có hiệu lực thật — thỏa thuận hoodia với người San và mức
    thu 1,5% cho rooibos là kết quả trực tiếp. Nhưng nó có một giới hạn cấu trúc: nó mặc định tài
    nguyên sinh học là tài sản thuộc chủ quyền một quốc gia. Với một sinh vật tự nó là chủ thể có
    quyền, khung này không có gì để nói.
  en: >-
    An international agreement in force since 2014 governing who may take biological material from
    where, and what must be given back. It rests on three pillars: permission must be obtained in
    advance from the provider country's competent authority and from the indigenous communities
    concerned; a contract must be negotiated setting out access terms, milestone payments and royalties;
    and benefits must be shared fairly, in money and in transferred research capacity. It has real
    effect — the hoodia agreement with the San people and the 1.5% rooibos levy are direct results. But
    it has a structural limit: it presumes that biological resources are property under some state's
    sovereignty. For an organism that is itself a rights-bearing subject, this framework has nothing to
    say.
