cover_prompt: >-
  A close view of a dark curved fin edge in shallow water with a ragged sheet of small white vapour
  bubbles tearing off behind it, the skin behind the sheet visibly pitted with tiny pale craters, cold
  mist grey against ocean teal and void indigo, painterly naturalist plate, no text, no labels.
