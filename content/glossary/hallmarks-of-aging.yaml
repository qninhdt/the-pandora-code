cover_prompt: >-
  A painterly anatomical plate arranged as a wheel of a dozen small vignettes around a single dim
  human silhouette, each vignette showing a different failing structure - a frayed chromosome end, a
  tangled protein clump, a dark shrivelled mitochondrion, an empty stem-cell niche - cool teal and
  indigo with faint amber decay accents, painterly naturalist plate, no text, no labels.
