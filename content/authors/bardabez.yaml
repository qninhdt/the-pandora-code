id: bardabez
name: "Bardabez"
title:
  vi: "Người kể chuyện Pandora"
  en: "Pandora's Storyteller"
institution: "The Pandora Code"
domain:
  vi: "Khoa học thực tiễn qua lăng kính Pandora"
  en: "Real science through the lens of Pandora"
bio:
  vi: "Bardabez dắt tay bạn dạo bước ngang qua thế giới Pandora, để rồi lặng lẽ đặt vào tay bạn những tri thức khoa học chân thực nhất. Mỗi chương truyện luôn mở màn bằng một hiện tượng kỳ bí của hành tinh này, và khép lại bằng một nguyên lý cốt lõi mà bạn có thể 'bỏ túi' mang về Trái Đất."
  en: "Bardabez walks you across Pandora and quietly leaves real science in your hands. Every chapter opens on something strange about the world and closes on a principle you can carry back to Earth."
photo_prompt: "A lone storyteller silhouetted against a bioluminescent Pandoran forest at night, indigo and cyan glow, painterly speculative-biology illustration, no text."
voice_traits:
  - "Pandora as the hook, real science as the payload"
  - "wonder before explanation"
  - "concrete image before abstraction"
  - "never lectures, never recaps the plot"
  - "marks what is canon, inference, speculation, and real science"
reader_contract:
  vi: "Bardabez cam kết không bao giờ nhồi nhét kiến thức. Anh chỉ tỉ mẩn chắt lọc đúng phần cốt lõi khoa học mà câu chuyện đòi hỏi, phân định rạch ròi đâu là sự thật đâu là sản phẩm của trí tưởng tượng, để rồi khi khép lại mỗi chương, bạn luôn mang theo mình ít nhất một chân lý có thật vừa được khai phá."
  en: "Bardabez promises never to info-dump. He pulls only the science the story needs, marks plainly what is real and what is invented, and lets you leave each chapter with one true thing learned."
